# spine_bridge. wheelbase and track come from aav_description/config/vehicle.yaml (the
# launch file passes them); don't set them here.
spine_bridge:
  ros__parameters:
    cmd_timeout: 0.1          # s: stop sending DRIVE_CMD when /ego/actuator_cmd is older.
                              # 5 of ego's 50 Hz messages. Plus the spine's 100 ms
                              # watchdog (spine-core cmd_timeout_ms), the car brakes at
                              # most 0.2 s after ego stops.
    drive_rate_hz: 50.0       # DRIVE_CMD rate; the spine's watchdog is 100 ms
    estop_rate_hz: 10.0       # ESTOP_CMD heartbeat (also sent at once on change)
    speed_variance: 0.01      # (m/s)^2 on /vehicle/odom vx. TODO from a bag
    yaw_rate_variance: 0.02   # (rad/s)^2
    steering_joints: [front_left_steering_joint, front_right_steering_joint]
