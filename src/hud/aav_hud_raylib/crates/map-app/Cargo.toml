[package]
name = "map-app"
description = "map: the big screen's map window, one raylib program that is also its ROS node"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "map"
path = "src/main.rs"

[features]
# colcon builds with ROS. `--no-default-features` builds a map window that only runs
# --demo, on any computer, with no ROS sourced.
default = ["ros"]
ros = ["dep:rclrs", "dep:ros-env", "dep:ctrlc"]

[dependencies]
anyhow = "1"
hud-core = { path = "../hud-core" }
# Only its library: the window's monitor and full screen, shared with the HUD.
hud-app = { path = "../hud-app", default-features = false }
map-core = { path = "../map-core" }
# The same raylib as hud-app: blank images (the map's texture), TrueType fonts, and
# --screenshot.
raylib = { version = "6", features = [
  "SUPPORT_IMAGE_GENERATION",
  "SUPPORT_FILEFORMAT_TTF",
  "SUPPORT_SCREEN_CAPTURE",
] }
# SIGINT, plus SIGTERM and SIGHUP: rclrs 0.8 has no signal handling of its own yet.
ctrlc = { version = "3", features = ["termination"], optional = true }
rclrs = { version = "0.8", optional = true }
# The message types: compiled from the Rust code that ships with Jazzy (AMENT_PREFIX_PATH).
ros-env = { version = "0.3", optional = true }
