# hud_server: the HUD's back end (Flask and Socket.IO) for the app in hud/flutter_pi.
hud_server:
  ros__parameters:
    host: 127.0.0.1           # who may connect: only this computer. 0.0.0.0 = any computer
    port: 5000                # the app connects to 127.0.0.1:5000 (a Mac's AirPlay uses 5000)
    max_event_rate: 10.0      # Hz: the most speed, position and route updates per second
    route_tolerance: 1.0      # m: a route point this close to a straight line is dropped
    waypoint_spacing: 5.0     # m: the least distance between two GPS waypoints
    camera_fps: 5.0           # Hz: the most pictures a second on /camera/stream
    camera_idle_timeout: 5.0  # s: stop receiving /camera/image_raw this long after the last fetch
    camera_stale_after: 2.0   # s: an older picture isn't served (the camera stopped)
