# lane_finder: the lane lines in the front camera's pictures (aav_lane_finder).
# The launch file adds the camera's place on the car (camera_xyz, camera_rpy) and the
# wheelbase, from aav_description's vehicle.yaml. Every other setting is in
# aav_lane_finder/lane_lines.py (Settings), with what it means.
lane_finder:
  ros__parameters:
    focal_px: 343.0          # px: only until /camera/camera_info arrives (the bench camera's)
    # The bird's-eye view: the patch of road it looks at, in base_link.
    x_min: 4.0               # m ahead: about where the bench camera first sees the road
    x_max: 16.0              # m ahead: further out, 360 rows give too few rows per metre
    y_max: 4.0               # m either side
    resolution: 0.05         # m per pixel
    # The paint and the lane.
    paint_contrast: 40.0     # grey levels brighter than the road on both sides
    paint_width: 0.30        # m: the widest paint it looks for
    lane_width: 3.5          # m: assumed until both lines are seen (the bench road's)
    lookahead: 3.0           # m ahead of base_link, where vehicle_offset_m is measured
    min_confidence: 0.3      # 0 to 1: below it, a line isn't detected
    debug_image: false       # true: /lane_geometry/image, the bird's-eye view and what it found
