# The Jetson Orin in the middle of the car: the decision-making parts, and perception.
# TODO: set imu/gps/teleop/camera to wherever those USB devices are actually plugged in.
parts:
  description: true
  mux: true
  ego: true
  teleop: false         # the joystick receiver: see laptop.yaml
  scripted: true
  imu: true             # TODO is the IMU on the Orin's USB?
  gps: true             # TODO is the u-blox on the Orin's USB?
  radar: false          # perception, later
  battery: false
  camera: false         # TODO which cameras (Q22), and are they on the Orin's USB?
  detector: true        # YOLO, as yolo_detector_orin. Needs JetPack's PyTorch: the reflash (Q24)
  stop_signs: true      # the stop-sign watcher: one per car, next to the mux
  radar_clusters: false # with the radar, later
  # lane: TODO the lane finder is being written; then a lane part here
  localization: true
  navigation: true
  spine: false          # true once the CAN spine exists (and legacy_* false)
  legacy_uart: false    # runs on motor_pi, which is wired to the ESP32
  legacy_encoder: false # the Pico sends only to the Motor Pi: see motor_pi.yaml
  foxglove: true

# The detector's settings: aav_yolo detector.launch.py's arguments.
detector:
  model: models/yolo11n.engine  # TensorRT, built on the Orin itself: python3 tools/build_engine.py
