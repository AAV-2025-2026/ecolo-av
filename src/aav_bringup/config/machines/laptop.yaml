# The safety driver's laptop, joystick plugged in. RViz/Foxglove run here too, by hand.
parts:
  teleop: true
  detector: true    # YOLO on this laptop's GPU, as yolo_detector_laptop: pixi run -e ml car laptop
                    # (in the default environment, the part says what's missing and is skipped)

# The detector's settings: aav_yolo detector.launch.py's arguments.
detector:
  model: models/yolo11n.mlpackage   # Core ML, on a Mac: pixi run -e ml export-coreml.
                                    # A Linux laptop: models/yolo11n.pt
  compressed: true                  # the camera's JPEG pictures: raw ones are too big for WiFi
