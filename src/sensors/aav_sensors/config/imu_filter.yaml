# imu_filter_madgwick (imu_tools 2.1.6, Jazzy): /sensors/imu/data_raw -> /sensors/imu/data with an
# orientation estimate. Parameter names checked in imu_filter_ros.cpp.
#
# use_mag is false: the Yahboom driver's /sensors/imu/mag isn't in tesla yet. Without it the yaw
# is only relative (it starts at 0 and drifts), so the EKFs fuse the yaw RATE, not the
# yaw. Heading comes from the start pose (see aav_localization/config/navsat.yaml).
imu_filter_madgwick:
  ros__parameters:
    use_mag: false
    publish_tf: false           # robot_localization owns the TF tree; the default true would fight it
    world_frame: enu            # REP-103
    fixed_frame: odom
    gain: 0.1
    zeta: 0.0
    remove_gravity_vector: false   # robot_localization removes gravity itself (imu0_remove_gravitational_acceleration)
    orientation_stddev: 0.05    # rad. Default 0.0 would claim a perfect orientation
    constant_dt: 0.0            # use message stamps
