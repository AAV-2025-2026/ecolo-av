[package]
name = "spine-sim"
description = "spine_sim: the spine on a laptop, as a ROS node (bench mode)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "spine_sim"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bench-car = { path = "../bench-car" }
# SIGINT, plus SIGTERM and SIGHUP: rclrs 0.8 has no signal handling of its own yet.
ctrlc = { version = "3", features = ["termination"] }
rclrs = "0.8"
# The message types: compiled from the Rust code that ships with Jazzy (AMENT_PREFIX_PATH).
ros-env = "0.3"
