<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Verdana, Arial, Helvetica, sans-serif" font-size="14">
  <title>How the chips join ROS 2, with no ROS on the chip</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .linux { fill:#FDECEE; stroke:#C8102E; stroke-width:2.5; }
      .node  { fill:#FFFFFF; stroke:#C8102E; stroke-width:1.6; }
      .chips { fill:#F2F2F2; stroke:#999; stroke-width:1.2; }
      .chip  { fill:#FFFFFF; stroke:#C8102E; stroke-width:1.6; }
      .next  { fill:#FFFFFF; stroke:#BBB; stroke-width:1.4; stroke-dasharray:6 4; }
      .wire  { stroke:#555; stroke-width:1.8; }
      .h1 { fill:#222; font-weight:bold; font-size:20px; }
      .t  { fill:#222; font-weight:bold; font-size:16px; }
      .b  { fill:#222; }
      .s  { fill:#555; font-size:13px; }
      .r  { fill:#C8102E; font-weight:bold; font-size:13px; }
    </style>
  </defs>

  <text class="h1" x="30" y="40">How the chips join ROS 2, with no ROS on the chip</text>
  <text class="s" x="30" y="64">A small bridge node on a Linux computer turns ROS topics into plain wire messages, and back.</text>

  <!-- Linux: the ROS 2 nodes -->
  <rect class="linux" x="25" y="82" width="910" height="160" rx="10"/>
  <text class="t" x="45" y="108">Linux computers: ROS 2 nodes</text>
  <text class="s" x="915" y="108" text-anchor="end">in Python, C++, or Rust with rclrs</text>

  <rect class="node" x="45" y="122" width="280" height="108" rx="8"/>
  <text class="t" x="59" y="148">legacy_uart_bridge</text>
  <text class="s" x="59" y="172">on the Motor Pi · today</text>
  <text class="s" x="59" y="192">in: /ego/actuator_cmd</text>
  <text class="s" x="59" y="212">out: nothing (no feedback)</text>

  <rect class="node" x="340" y="122" width="280" height="108" rx="8"/>
  <text class="t" x="354" y="148">encoder_udp</text>
  <text class="s" x="354" y="172">on the Motor Pi · today</text>
  <text class="s" x="354" y="192">out: /vehicle/odom</text>

  <rect class="node" x="635" y="122" width="280" height="108" rx="8"/>
  <text class="t" x="649" y="148">spine_bridge</text>
  <text class="s" x="649" y="172">on the Orin · next</text>
  <text class="s" x="649" y="192">in: /ego/actuator_cmd</text>
  <text class="s" x="649" y="212">out: /vehicle/status, /vehicle/odom</text>

  <!-- The chips' band first, so the wires draw on top of it -->
  <rect class="chips" x="25" y="330" width="910" height="190" rx="10"/>

  <!-- The wires: where ROS stops -->
  <line x1="25" y1="312" x2="935" y2="312" stroke="#C8102E" stroke-width="1.6" stroke-dasharray="8 6"/>
  <text class="r" x="935" y="304" text-anchor="end">ROS 2 STOPS HERE</text>

  <line class="wire" x1="75" y1="232" x2="75" y2="352" marker-end="url(#arr)"/>
  <text class="b" x="88" y="264">UART, 115200 baud</text>
  <text class="s" x="88" y="282">13-byte frames</text>

  <line class="wire" x1="370" y1="354" x2="370" y2="232" marker-end="url(#arr)"/>
  <text class="b" x="383" y="264">UDP over Ethernet</text>
  <text class="s" x="383" y="282">port 10111</text>

  <line class="wire" x1="665" y1="232" x2="665" y2="352" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text class="b" x="678" y="264">CAN bus</text>
  <text class="s" x="678" y="282">frames from our CAN map</text>

  <!-- The chips: bare metal -->

  <rect class="chip" x="45" y="356" width="280" height="122" rx="8"/>
  <text class="t" x="59" y="382">ESP32 · today</text>
  <text class="s" x="59" y="406">2025-26 firmware, C++ (Arduino)</text>
  <text class="s" x="59" y="426">I2C: 2 Jrk G2s (steering, brake),</text>
  <text class="s" x="59" y="446">the throttle DAC, the expander;</text>
  <text class="s" x="59" y="466">and the RC receiver (iBUS)</text>

  <rect class="chip" x="340" y="356" width="280" height="122" rx="8"/>
  <text class="t" x="354" y="382">Pico 2 + W5500 · today</text>
  <text class="s" x="354" y="406">the wheel encoder, C++ (Arduino)</text>
  <text class="s" x="354" y="426">two IR sensors count the spokes</text>

  <rect class="next" x="635" y="356" width="280" height="122" rx="8"/>
  <text class="t" x="649" y="382">The spine · next</text>
  <text class="s" x="649" y="406">Rust: spine-core and the drivers</text>
  <text class="s" x="649" y="426">the same actuators, plus arming,</text>
  <text class="s" x="649" y="446">a watchdog and the e-stop</text>
  <text class="s" x="649" y="466">chip still to pick (Q10–Q13)</text>

  <text class="t" x="45" y="505">Microcontrollers: bare metal, no operating system, no ROS</text>

  <text class="s" x="30" y="556">No micro-ROS for now (we think again once we see the hardware): no ROS library on a chip.</text>
  <text class="s" x="30" y="576">A ROS node on Linux talks to each chip over a plain wire, and publishes what the chip says.</text>
</svg>
