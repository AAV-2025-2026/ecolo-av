<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Verdana, 'DejaVu Sans', Arial, Helvetica, sans-serif" font-size="14">
  <title>How Python, C++ and Rust sit on the same ROS 2 core</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .ours  { fill:#FFFFFF; stroke:#C8102E; stroke-width:2; }
      .stock { fill:#F2F2F2; stroke:#999; stroke-width:1.2; }
      .later { fill:#FFFFFF; stroke:#BBB; stroke-width:1.2; stroke-dasharray:5 4; }
      .band  { fill:#FDECEE; stroke:#C8102E; stroke-width:1.2; }
      .t  { fill:#222; font-weight:bold; }
      .s  { fill:#555; font-size:12px; }
      .lbl { fill:#C8102E; font-size:12px; font-weight:bold; }
      .layer { fill:#C8102E; font-size:12px; font-weight:bold; letter-spacing:1px; }
      .line { stroke:#555; stroke-width:1.5; fill:none; marker-end:url(#arr); }
    </style>
  </defs>

  <!-- client libraries -->
  <rect class="ours" x="20" y="20" width="200" height="90" rx="8"/>
  <text class="t" x="120" y="46" text-anchor="middle">Python · rclpy</text>
  <text class="lbl" x="120" y="67" text-anchor="middle">official</text>
  <text class="s" x="120" y="88" text-anchor="middle">our nodes, launch files</text>
  <rect class="stock" x="240" y="20" width="200" height="90" rx="8"/>
  <text class="t" x="340" y="46" text-anchor="middle">C++ · rclcpp</text>
  <text class="lbl" x="340" y="67" text-anchor="middle">official</text>
  <text class="s" x="340" y="88" text-anchor="middle">Nav2, EKFs, IMU driver</text>
  <rect class="later" x="460" y="20" width="200" height="90" rx="8"/>
  <text class="t" x="560" y="46" text-anchor="middle">Rust · rclrs</text>
  <text class="s" x="560" y="67" text-anchor="middle">community (crates.io)</text>
  <text class="s" x="560" y="88" text-anchor="middle">not used in ROS yet</text>
  <path class="line" d="M120,110 L120,126"/>
  <path class="line" d="M340,110 L340,126"/>
  <path class="line" d="M560,110 L560,126"/>

  <!-- the shared core -->
  <rect class="stock" x="20" y="128" width="640" height="56" rx="8"/>
  <text class="t" x="340" y="152" text-anchor="middle">rcl: the shared core, written in C</text>
  <text class="s" x="340" y="171" text-anchor="middle">every client library wraps it, so they all behave the same</text>
  <rect class="stock" x="20" y="196" width="640" height="56" rx="8"/>
  <text class="t" x="340" y="220" text-anchor="middle">rmw: a plug for the middleware</text>
  <text class="s" x="340" y="239" text-anchor="middle">swap the network layer without touching any node</text>
  <rect class="stock" x="20" y="264" width="640" height="56" rx="8"/>
  <text class="t" x="340" y="288" text-anchor="middle">DDS (Fast DDS by default)</text>
  <text class="s" x="340" y="307" text-anchor="middle">finds the other nodes on the network and moves the bytes</text>

  <!-- messages -->
  <rect class="band" x="690" y="20" width="190" height="300" rx="8"/>
  <text class="t" x="785" y="48" text-anchor="middle">Messages</text>
  <text class="s" x="785" y="70" text-anchor="middle">.msg · .srv · .action</text>
  <text class="s" x="785" y="106" text-anchor="middle">one definition,</text>
  <text class="s" x="785" y="124" text-anchor="middle">generated into</text>
  <text class="t" x="785" y="158" text-anchor="middle">Python classes</text>
  <text class="t" x="785" y="186" text-anchor="middle">C++ structs</text>
  <text class="t" x="785" y="214" text-anchor="middle">Rust crates</text>
  <text class="s" x="785" y="252" text-anchor="middle">so every language</text>
  <text class="s" x="785" y="270" text-anchor="middle">speaks the same</text>
  <text class="s" x="785" y="288" text-anchor="middle">types</text>

  <!-- below ROS -->
  <text class="layer" x="20" y="344">BELOW ROS</text>
  <rect class="ours" x="20" y="352" width="380" height="58" rx="8"/>
  <text class="t" x="210" y="376" text-anchor="middle">spine firmware: Rust, no ROS</text>
  <text class="s" x="210" y="396" text-anchor="middle">ESP32, no_std: it only speaks CAN frames</text>
  <path class="line" d="M400,381 L468,381"/>
  <text class="lbl" x="434" y="373" text-anchor="middle">CAN</text>
  <rect class="ours" x="470" y="352" width="410" height="58" rx="8"/>
  <text class="t" x="675" y="376" text-anchor="middle">spine_bridge: a Python node</text>
  <text class="s" x="675" y="396" text-anchor="middle">turns CAN frames into ROS topics, and back</text>
</svg>
