<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Verdana, 'DejaVu Sans', Arial, Helvetica, sans-serif" font-size="14">
  <title>A command's journey: drivers, twist_mux, ego, a backend, the board, the wheels; and the sensors back to the EKFs</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8102E"/>
    </marker>
    <style>
      .stock { fill:#F2F2F2; stroke:#999; stroke-width:1.2; }
      .new   { fill:#FFFFFF; stroke:#C8102E; stroke-width:2.2; }
      .safe  { fill:#FDECEE; stroke:#C8102E; stroke-width:1.2; }
      .t  { fill:#222; font-weight:bold; font-size:15px; }
      .s  { fill:#555; font-size:12.5px; }
      .m  { fill:#222; font-size:12px; font-family:Menlo, 'DejaVu Sans Mono', monospace; }
      .tag { fill:#C8102E; font-size:11px; font-weight:bold; }
      .layer { fill:#C8102E; font-size:13px; font-weight:bold; letter-spacing:1px; }
      .flow { stroke:#555; stroke-width:1.8; fill:none; }
      .arrow { stroke:#555; stroke-width:1.8; fill:none; marker-end:url(#arr); }
      .canarrow { stroke:#C8102E; stroke-width:3; fill:none; marker-end:url(#arrr); }
      .wire { stroke:#555; stroke-width:1.6; fill:none; stroke-dasharray:6 4; marker-end:url(#arr); }
    </style>
  </defs>

  <!-- ===== DRIVERS ===== -->
  <text class="layer" x="18" y="26">DRIVERS: each sends a TwistStamped</text>
  <rect class="stock" x="18"  y="40" width="98" height="56" rx="8"/>
  <text class="t" x="67"  y="64" text-anchor="middle">Joystick</text>
  <text class="s" x="67"  y="84" text-anchor="middle">priority 100</text>
  <rect class="stock" x="124" y="40" width="98" height="56" rx="8"/>
  <text class="t" x="173" y="64" text-anchor="middle">Keyboard</text>
  <text class="s" x="173" y="84" text-anchor="middle">90</text>
  <rect class="stock" x="230" y="40" width="98" height="56" rx="8"/>
  <text class="t" x="279" y="64" text-anchor="middle">Scripted</text>
  <text class="s" x="279" y="84" text-anchor="middle">50</text>
  <rect class="stock" x="336" y="40" width="98" height="56" rx="8"/>
  <text class="t" x="385" y="64" text-anchor="middle">Replay</text>
  <text class="s" x="385" y="84" text-anchor="middle">40</text>
  <rect class="stock" x="442" y="40" width="98" height="56" rx="8"/>
  <text class="t" x="491" y="64" text-anchor="middle">AI (lanes)</text>
  <text class="s" x="491" y="84" text-anchor="middle">10</text>
  <rect class="stock" x="548" y="40" width="98" height="56" rx="8"/>
  <text class="t" x="597" y="64" text-anchor="middle">Nav2</text>
  <text class="s" x="597" y="84" text-anchor="middle">20</text>

  <path class="flow" d="M67,96 V116 M173,96 V116 M279,96 V116 M385,96 V116 M491,96 V116 M597,96 V116 M67,116 H597"/>
  <path class="arrow" d="M332,116 V138"/>
  <text class="m" x="342" y="132">/drivers/&lt;name&gt;/cmd_vel</text>

  <!-- ===== twist_mux and its locks ===== -->
  <rect class="stock" x="182" y="140" width="300" height="56" rx="8"/>
  <text class="t" x="332" y="164" text-anchor="middle">twist_mux (stock)</text>
  <text class="s" x="332" y="184" text-anchor="middle">the highest number wins · 0.5 s timeout</text>
  <rect class="safe" x="500" y="140" width="146" height="56" rx="8"/>
  <text class="t" x="573" y="160" text-anchor="middle">Locks</text>
  <text class="s" x="573" y="176" text-anchor="middle">e-stop: 255</text>
  <text class="s" x="573" y="190" text-anchor="middle">stop sign: 30</text>
  <path class="arrow" d="M500,168 H484"/>

  <path class="arrow" d="M332,196 V248"/>
  <text class="m" x="342" y="218">/control/cmd_vel</text>
  <text class="s" x="342" y="236">TwistStamped</text>

  <!-- ===== ego ===== -->
  <rect class="stock" x="182" y="250" width="300" height="56" rx="8"/>
  <text class="t" x="332" y="274" text-anchor="middle">ego (ours)</text>
  <text class="s" x="332" y="294" text-anchor="middle">twist → speed + steering angle, limited</text>

  <path class="flow" d="M332,306 V344 M168,344 H496"/>
  <path class="arrow" d="M168,344 V368"/>
  <path class="arrow" d="M496,344 V368"/>
  <text class="m" x="342" y="322">/ego/actuator_cmd</text>
  <text class="s" x="342" y="338">AckermannDriveStamped · 50 Hz</text>

  <!-- ===== backends: exactly one runs ===== -->
  <text class="layer" x="18" y="362">ONE BACKEND</text>
  <rect class="stock" x="18" y="370" width="300" height="66" rx="8"/>
  <text class="t" x="168" y="392" text-anchor="middle">Today: aav_legacy</text>
  <text class="s" x="168" y="410" text-anchor="middle">legacy_uart_bridge, on the Motor-Pi</text>
  <text class="tag" x="168" y="427" text-anchor="middle">UNTESTED ON THE CAR</text>
  <rect class="new" x="346" y="370" width="300" height="66" rx="8"/>
  <text class="t" x="496" y="392" text-anchor="middle">KEFC: aav_spine</text>
  <text class="s" x="496" y="410" text-anchor="middle">spine_bridge, on Orin #1</text>
  <text class="m" x="496" y="427" text-anchor="middle">/can/tx → can0</text>

  <path class="arrow" d="M168,436 V478"/>
  <text class="s" x="178" y="462">UART, 13 bytes</text>
  <path class="canarrow" d="M496,436 V478"/>
  <text class="tag" x="506" y="462">CAN 0x100</text>

  <!-- ===== the board ===== -->
  <rect class="stock" x="18" y="480" width="628" height="56" rx="8"/>
  <text class="t" x="332" y="504" text-anchor="middle">ESP32 on the AAV control board</text>
  <text class="s" x="332" y="524" text-anchor="middle">today: no timeout · after KEFC: brakes when commands stop</text>

  <path class="wire" d="M118,536 V578"/>
  <path class="wire" d="M332,536 V578"/>
  <path class="wire" d="M546,536 V578"/>
  <text class="s" x="128" y="562">I2C</text>

  <!-- ===== moving parts ===== -->
  <rect class="stock" x="18"  y="580" width="200" height="56" rx="8"/>
  <text class="t" x="118" y="604" text-anchor="middle">Steering</text>
  <text class="s" x="118" y="624" text-anchor="middle">Jrk G2 #1</text>
  <rect class="stock" x="232" y="580" width="200" height="56" rx="8"/>
  <text class="t" x="332" y="604" text-anchor="middle">Brake</text>
  <text class="s" x="332" y="624" text-anchor="middle">Jrk G2 #2</text>
  <rect class="stock" x="446" y="580" width="200" height="56" rx="8"/>
  <text class="t" x="546" y="604" text-anchor="middle">Throttle</text>
  <text class="s" x="546" y="624" text-anchor="middle">DAC → motor controller</text>

  <!-- ===== THE WAY BACK ===== -->
  <text class="layer" x="690" y="26">THE WAY BACK</text>

  <path class="wire" d="M546,636 V650 H850 V639"/>
  <text class="s" x="654" y="645">turns</text>

  <rect class="stock" x="720" y="580" width="260" height="56" rx="8"/>
  <text class="t" x="850" y="602" text-anchor="middle">Wheel speed</text>
  <text class="m" x="850" y="622" text-anchor="middle">/vehicle/odom</text>
  <rect class="stock" x="720" y="500" width="260" height="56" rx="8"/>
  <text class="t" x="850" y="522" text-anchor="middle">IMU, then Madgwick</text>
  <text class="m" x="850" y="542" text-anchor="middle">/sensors/imu/data</text>
  <rect class="stock" x="720" y="420" width="260" height="56" rx="8"/>
  <text class="t" x="850" y="442" text-anchor="middle">GPS (u-blox), 1 Hz</text>
  <text class="m" x="850" y="462" text-anchor="middle">/sensors/gps/fix</text>

  <path class="flow" d="M720,608 H700 M720,528 H700 M720,448 H700 M700,608 V340"/>
  <path class="arrow" d="M700,340 V308"/>

  <rect class="stock" x="690" y="250" width="290" height="56" rx="8"/>
  <text class="t" x="835" y="274" text-anchor="middle">Two EKFs (stock)</text>
  <text class="s" x="835" y="294" text-anchor="middle">ekf_local, ekf_global · 30 Hz</text>

  <path class="arrow" d="M835,250 V198"/>

  <rect class="stock" x="690" y="140" width="290" height="56" rx="8"/>
  <text class="t" x="835" y="162" text-anchor="middle">Where the car is</text>
  <text class="m" x="835" y="182" text-anchor="middle">/localization/odom/local, TF</text>

  <path class="arrow" d="M835,140 V68 H648"/>
  <text class="s" x="700" y="60">Nav2 steers by it</text>

  <!-- ===== legend ===== -->
  <rect class="stock" x="18" y="660" width="40" height="22" rx="4"/>
  <text class="s" x="66" y="676">runs today in the turtle, Gazebo or the bench</text>
  <rect class="new" x="400" y="660" width="40" height="22" rx="4"/>
  <text class="s" x="448" y="676">new hardware (KEFC request)</text>
  <rect class="safe" x="680" y="660" width="40" height="22" rx="4"/>
  <text class="s" x="728" y="676">safety</text>
  <text class="s" x="18" y="706">Topic names as of 15 Oct (docs/naming.md). None of this has run on the real car yet.</text>
</svg>
