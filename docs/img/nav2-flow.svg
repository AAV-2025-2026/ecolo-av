<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Verdana, 'DejaVu Sans', Arial, Helvetica, sans-serif" font-size="14">
  <title>Nav2 on our car: a goal, the behaviour tree, the planner and the controller, then the smoother, collision_monitor and twist_mux</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C8102E"/>
    </marker>
    <style>
      .stock { fill:#F2F2F2; stroke:#999; stroke-width:1.2; }
      .key   { fill:#FFFFFF; stroke:#555; stroke-width:2; }
      .band  { fill:#FDECEE; stroke:#C8102E; stroke-width:1.2; }
      .t  { fill:#222; font-weight:bold; }
      .s  { fill:#555; font-size:12px; }
      .lbl { fill:#C8102E; font-size:12px; font-weight:bold; }
      .layer { fill:#C8102E; font-size:12px; font-weight:bold; letter-spacing:1px; }
      .line { stroke:#555; stroke-width:1.8; fill:none; marker-end:url(#arr); }
      .redline { stroke:#C8102E; stroke-width:2.2; fill:none; marker-end:url(#arrRed); }
    </style>
  </defs>

  <text class="layer" x="20" y="28">ONCE A SECOND: WHICH WAY TO THE GOAL?</text>

  <rect class="stock" x="20" y="44" width="160" height="66" rx="8"/>
  <text class="t" x="100" y="70" text-anchor="middle">a goal</text>
  <text class="s" x="100" y="90" text-anchor="middle">RViz, or GPS points</text>

  <rect class="key" x="220" y="44" width="200" height="66" rx="8"/>
  <text class="t" x="320" y="70" text-anchor="middle">bt_navigator</text>
  <text class="s" x="320" y="90" text-anchor="middle">the behaviour tree: the boss</text>

  <rect class="key" x="460" y="44" width="200" height="66" rx="8"/>
  <text class="t" x="560" y="70" text-anchor="middle">planner</text>
  <text class="s" x="560" y="90" text-anchor="middle">Smac Hybrid-A* · 1 Hz</text>

  <rect class="stock" x="700" y="44" width="180" height="66" rx="8"/>
  <text class="t" x="790" y="70" text-anchor="middle">global costmap</text>
  <text class="s" x="790" y="90" text-anchor="middle">map frame · 25 cm</text>

  <path class="line" d="M180,77 L218,77"/>
  <path class="line" d="M420,77 L458,77"/>
  <path class="line" d="M700,77 L662,77"/>

  <!-- plan down to the controller -->
  <path class="redline" d="M560,110 L560,150 L380,150 L380,198"/>
  <text class="lbl" x="470" y="142" text-anchor="middle">/plan</text>
  <path class="line" d="M280,110 L280,198"/>
  <text class="s" x="290" y="160">FollowPath</text>

  <text class="layer" x="600" y="186">20 TIMES A SECOND: STEER ALONG IT</text>

  <rect class="stock" x="20" y="200" width="160" height="66" rx="8"/>
  <text class="t" x="100" y="226" text-anchor="middle">local costmap</text>
  <text class="s" x="100" y="246" text-anchor="middle">odom · 10 cm · 20 m</text>

  <rect class="key" x="220" y="200" width="200" height="66" rx="8"/>
  <text class="t" x="320" y="226" text-anchor="middle">controller</text>
  <text class="s" x="320" y="246" text-anchor="middle">Regulated Pure Pursuit</text>

  <rect class="key" x="460" y="200" width="150" height="66" rx="8"/>
  <text class="t" x="535" y="226" text-anchor="middle">smoother</text>
  <text class="s" x="535" y="246" text-anchor="middle">speed, accel caps</text>

  <rect class="band" x="640" y="200" width="160" height="66" rx="8"/>
  <text class="t" x="720" y="226" text-anchor="middle">collision_monitor</text>
  <text class="s" x="720" y="246" text-anchor="middle">radar stop zone</text>

  <path class="line" d="M180,233 L218,233"/>
  <path class="line" d="M420,233 L458,233"/>
  <path class="line" d="M610,233 L638,233"/>

  <!-- radar -->
  <rect class="stock" x="20" y="330" width="160" height="66" rx="8"/>
  <text class="t" x="100" y="356" text-anchor="middle">radar</text>
  <text class="s" x="100" y="376" text-anchor="middle">/sensors/radar/points</text>
  <path class="line" d="M100,330 L100,268"/>
  <path class="line" d="M180,363 L670,363 L670,268"/>

  <!-- out -->
  <rect class="key" x="720" y="330" width="160" height="66" rx="8"/>
  <text class="t" x="800" y="356" text-anchor="middle">twist_mux → ego</text>
  <text class="s" x="800" y="376" text-anchor="middle">Nav2 = priority 20</text>
  <path class="redline" d="M760,266 L760,328"/>
  <text class="lbl" x="752" y="304" text-anchor="end">/drivers/nav/cmd_vel</text>

  <text class="s" x="450" y="428" text-anchor="middle">Nav2 is just one more driver: it proposes a speed and turn rate. ego and the backend move the car.</text>
</svg>
