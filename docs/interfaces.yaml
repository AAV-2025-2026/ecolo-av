# The node graph contract: every topic, service and action between our packages.
#
# docs/interfaces.md is generated from this file (tools/gen_interfaces_md.py), and
# tools/check_graph.py compares a running system against it. Change the graph here first.
#
# live: the bringup profiles where the topic must have a publisher
#   turtle = aav_bringup turtle.launch.py, sim = sim.launch.py, car = car.launch.py,
#   replay = replay.launch.py with a bag playing (the bag supplies the raw inputs),
#   bench = bench.launch.py: the car's graph, with stand-ins for the hardware,
#   road = sim.launch.py world:=road: Gazebo's road world, which adds the car's camera and
#   radar stand-in. Whatever is live in sim must be live there too (check_graph.py)
# All topic names are absolute. QoS is the ROS default (reliable, volatile, depth 10)
# unless noted.
#
# Names (docs/naming.md, Decided 15 Oct): every topic starts with its area,
#   /<area>/<device or node>/<thing>
# areas: /sensors/ /vehicle/ /can/ /localization/ /perception/ /drivers/ /control/ /ego/
# /safety/ /hud/ /system/. Only ROS's own global names (/tf, /tf_static, /clock, /joint_states,
# /robot_description...) and Nav2's (/map, /goal_pose, /plan) stay outside an area.
# tools/tests/test_topic_areas.py checks every topic below.

topics:
  # --- drivers -> mux -> ego (the command path) ---
  /drivers/joy/joy:
    type: sensor_msgs/msg/Joy
    pub: [joy_node]
    sub: [teleop_twist_joy_node, joy_teleop]
    note: Joystick axes and buttons, 20 Hz while held. joy_node, teleop_twist_joy_node and joy_teleop run in the namespace /drivers/joy (aav_teleop teleop.launch.py), so their relative topics land here.
  /drivers/joy/cmd_vel:
    type: geometry_msgs/msg/TwistStamped
    pub: [teleop_twist_joy_node]
    sub: [twist_mux, language_drive]
    note: Priority 100. Only while the deadman (trigger) is held.
  /drivers/keyboard/cmd_vel:
    type: geometry_msgs/msg/TwistStamped
    pub: [teleop_twist_keyboard]
    sub: [twist_mux, language_drive]
    note: Priority 90 (twist_mux's keyboard slot). A person driving from a laptop - teleop_twist_keyboard in the namespace /drivers/keyboard (tools/keyboard.sh, stamped:=true), or the Foxglove teleop panel set to this topic.
  /drivers/tests/cmd_vel:
    type: geometry_msgs/msg/TwistStamped
    pub: [actuator_test]
    sub: [twist_mux, language_drive]
    note: Priority 60, below both people (joystick 100, keyboard 90) and above every other program. Only while an actuator test runs (aav_actuator_tests, pixi run actuator-test; READ-ME-TESTS.md stages 3-4). It also reads /control/cmd_vel, to stop when someone else takes over.
  /drivers/scripted/cmd_vel:
    type: geometry_msgs/msg/TwistStamped
    pub: [scripted_driver]
    sub: [twist_mux, language_drive]
    note: Priority 50. Only while a /scripted_drive goal runs. language_drive (aav_language, plain-English driving) only reads the mux inputs' arrival times, to tell who drives.
  /drivers/replay/cmd_vel:
    type: geometry_msgs/msg/TwistStamped
    pub: []
    sub: [twist_mux, language_drive]
    note: Priority 40. ros2 bag play of a recorded /control/cmd_vel (tools/replay_commands.sh).
  /drivers/nav/cmd_vel:
    type: geometry_msgs/msg/TwistStamped
    pub: [velocity_smoother, collision_monitor]
    sub: [twist_mux, language_drive]
    note: Priority 20. Nav2. From collision_monitor where the radar or the lidar runs (navigation.launch.py radar:=true or lidar:=true - the bench, the car with its radar part, Gazebo's road and test_lot worlds), else straight from velocity_smoother.
  /control/cmd_vel_smoothed:
    type: geometry_msgs/msg/TwistStamped
    pub: [velocity_smoother]
    sub: [collision_monitor]
    note: Nav2's smoothed command, into collision_monitor, where the radar or the lidar runs. It stops the car for radar or lidar points in its stop zone, or when either goes silent; it only guards Nav2.
  /safety/sensor_watchdog/lock:
    type: std_msgs/msg/Bool
    pub: [sensor_watchdog]
    sub: [twist_mux]
    live: [sim]
    note: true while a sensor Nav2 or the AI slot needs is stale, NaN, frozen, jumped, or (the wheels) disagrees with the IMU; false otherwise (aav_safety sensor_watchdog, 10 Hz) - a heartbeat. A twist_mux lock at priority 30, as the stop sign - it holds Nav2 and the AI slot, never a person or a test. Fail-safe - the lock's 1 s timeout holds them too when the watchdog dies or hangs (aav_mux mux.launch.py sensor_lock, true wherever a watchdog runs - Gazebo with watchdog:=true, the bench, and the car next to the mux; false on the turtle).
  /safety/sensor_watchdog/state:
    type: std_msgs/msg/String
    pub: [sensor_watchdog]
    sub: [hud, map]
    live: [sim]
    note: One line for people, 10 Hz - OK, or STOP (the lock is on) or WARN, then each input that isn't OK and why, such as "STOP - gps STALE (nothing for 2.3 s (more than 2 s))". The HUD and the map window show it as a banner, red for STOP or when it goes silent (then twist_mux holds Nav2 too).
  /safety/collision_monitor/state:
    type: nav2_msgs/msg/CollisionMonitorState
    pub: [collision_monitor]
    sub: []
    note: What collision_monitor does, on each change - action_type 0 nothing, 1 stop; polygon_name StopZone, or "invalid source" when the radar or the lidar is silent or its TF is late.
  /safety/collision_monitor/stop_zone:
    type: geometry_msgs/msg/PolygonStamped
    pub: [collision_monitor]
    sub: []
    note: The stop zone in base_link, for RViz - from the front bumper to 1 m ahead, 0.2 m wider than the body each side (vehicle.yaml, through aav_description vehicle.py).
  /safety/collision_monitor/collision_points_marker:
    type: visualization_msgs/msg/MarkerArray
    pub: [collision_monitor]
    sub: []
    note: The radar and lidar points collision_monitor sees, for RViz; sent only while someone listens.
  /drivers/ai/cmd_vel:
    type: geometry_msgs/msg/TwistStamped
    pub: [control_interface]
    sub: [twist_mux, language_drive]
    note: Priority 10, the slot for a learned driver. Today the 2025-26 lane keeping (aav_lane_geometry) uses it.
  /safety/estop:
    type: std_msgs/msg/Bool
    pub: [joy_teleop, hud_server, hud, language_drive]
    sub: [twist_mux, spine_bridge, legacy_uart_bridge, language_drive, actuator_test]
    note: true = stop. Lock on twist_mux (priority 255) and the backends brake at once. Cleared only by publishing false, from a laptop. The HUD's e-stop button only ever publishes true (five times in 0.5 s), reliable like the backends' subscriptions - hud_server (the Flutter app's back end) and hud (aav_hud_raylib) alike - and language_drive (aav_language), the same way, from its estop() tool; it never publishes false.
  /control/cmd_vel:
    type: geometry_msgs/msg/TwistStamped
    pub: [twist_mux]
    sub: [ego, actuator_test]
    live: [turtle, sim, car, bench]
    note: The one command ego obeys. v (m/s) and w (rad/s) in base_link.
  /ego/actuator_cmd:
    type: ackermann_msgs/msg/AckermannDriveStamped
    pub: [ego]
    sub: [spine_bridge, legacy_uart_bridge, turtlesim_adapter, gazebo_adapter, carla_adapter]
    live: [turtle, sim, car, bench]
    note: 50 Hz, always. speed (m/s), steering_angle (rad, + left), acceleration, steering_angle_velocity. Exactly one backend runs.

  # --- the system: what kind of run this is ---
  /system/source:
    type: aav_interfaces/msg/DataSource
    pub: [gazebo_adapter, turtlesim_adapter, spine_bridge, legacy_uart_bridge, mock_imu, mock_gps, mock_battery, mock_camera, mock_radar, replay_source]
    sub: [hud, map, actuator_test]
    live: [turtle, sim, car, replay, bench]
    note: Latched (reliable, transient local, depth 1). Where the data comes from - REAL, SIM, BENCH or REPLAY - per sensor, one list per announcer. Gazebo and turtlesim announce SIM; spine_bridge REAL on the car and BENCH on the bench (its source parameter), with each bench stand-in; legacy_uart_bridge REAL; replay.launch.py REPLAY. The HUD shows a banner when anything isn't REAL.

  # --- backends -> the rest ---
  /vehicle/odom:
    type: nav_msgs/msg/Odometry
    pub: [spine_bridge, encoder_udp, turtlesim_adapter, gazebo_adapter, carla_adapter]
    sub: [ekf_local, ekf_global, actuator_test, sensor_watchdog]
    live: [turtle, sim, car, replay, bench]
    note: Twist only (vx, vy = 0, vyaw) in base_link, with covariances; pose covariance 1e3 (not measured). On the car, vx comes from the front wheel nodes when fresh, else from the spine's VEHICLE_FEEDBACK.
  /vehicle/status:
    type: aav_interfaces/msg/VehicleStatus
    pub: [spine_bridge, gazebo_adapter, turtlesim_adapter]
    sub: [hud_server, hud, language_drive]
    live: [turtle, sim, bench]
    note: Mode, armed, e-stop, measured speed and steering, actuator levels, fault bits. For the HUD and Foxglove.
  /vehicle/steering:
    type: aav_interfaces/msg/ActuatorState
    pub: [spine_bridge, gazebo_adapter, turtlesim_adapter]
    sub: [actuator_test]
    live: [turtle, sim, bench]
    note: The steering, the virtual centre wheel (rad, + left) - command (from /ego/actuator_cmd) and measured. In Gazebo, measured is the actuator model's angle (its speed, lag, offset and deadband). For plots and the actuator tests; /vehicle/status keeps it too.
  /vehicle/throttle:
    type: aav_interfaces/msg/ActuatorState
    pub: [spine_bridge, gazebo_adapter]
    sub: [actuator_test]
    live: [sim, bench]
    note: The throttle, 0..1. From the spine (car, bench) only measured; command is NaN, as the spine's speed loop decides it. In Gazebo, command is the speed loop's, measured the actuator model's.
  /vehicle/brake:
    type: aav_interfaces/msg/ActuatorState
    pub: [spine_bridge, gazebo_adapter]
    sub: [actuator_test]
    live: [sim, bench]
    note: The brake, 0..1. As /vehicle/throttle.
  /vehicle/wheels:
    type: aav_interfaces/msg/WheelSpeeds
    pub: [gazebo_adapter, spine_bridge]
    sub: [actuator_test]
    live: [sim, bench]
    note: Each wheel's ground speed (m/s, signed), NaN where not measured or stale. Gazebo gives all four (its wheel joints). spine_bridge gives the front two, from the CAN wheel nodes (0x200, 0x201) at about 100 Hz; their mean, when fresh, is the speed in /vehicle/odom. The 2025-26 car (aav_legacy) has one encoder, read only as /vehicle/odom.
  /vehicle/joint_states:
    type: sensor_msgs/msg/JointState
    pub: [spine_bridge]
    sub: [joint_state_publisher]
    live: [bench]
    note: Measured front steering joint angles, merged into /joint_states.
  /joint_states:
    type: sensor_msgs/msg/JointState
    pub: [joint_state_publisher, gz_bridge]
    sub: [robot_state_publisher]
    live: [turtle, sim, car, replay, bench]
  /can/tx:
    type: can_msgs/msg/Frame
    pub: [spine_bridge]
    sub: [socket_can_sender, spine_sim]
    live: [bench]
    note: DRIVE_CMD 0x100 at 50 Hz, ESTOP_CMD 0x010 at 10 Hz (firmware/can/aav.dbc).
  /can/rx:
    type: can_msgs/msg/Frame
    pub: [socket_can_receiver, spine_sim]
    sub: [spine_bridge]
    live: [bench]
    note: VEHICLE_FEEDBACK 0x180 at 50 Hz, VEHICLE_STATUS 0x181 at 10 Hz, WHEEL_SPEED_L 0x200 and WHEEL_SPEED_R 0x201 at 100 Hz. On the bench, spine_sim sends them all.

  # --- sensors ---
  /sensors/imu/data_raw:
    type: sensor_msgs/msg/Imu
    pub: [imu_node, gazebo_adapter, mock_imu]
    sub: [imu_filter_madgwick, actuator_test]
    live: [sim, car, replay, bench]
    note: Gyro and accelerometer in imu_link, with covariances; no orientation.
  /sensors/imu/mag:
    type: sensor_msgs/msg/MagneticField
    pub: [imu_node, mock_imu]
    sub: [imu_filter_madgwick]
    live: [bench]
    note: Raw counts from imu_node (not tesla yet); tesla from mock_imu. The filter ignores it (use_mag false).
  /sensors/imu/data:
    type: sensor_msgs/msg/Imu
    pub: [imu_filter_madgwick]
    sub: [ekf_local, ekf_global, sensor_watchdog]
    live: [sim, car, replay, bench]
    note: Adds a relative orientation (no magnetometer). The EKFs fuse the yaw rate only.
  /sensors/gps/fix:
    type: sensor_msgs/msg/NavSatFix
    pub: [ublox_gps, gps_nmea, ublox_nav_sat_fix_hp, gazebo_adapter, mock_gps]
    sub: [navsat_transform, hud, language_drive, actuator_test, sensor_watchdog]
    live: [sim, car, replay, bench]
    note: Lat/lon of the antenna (gps_link). On the car, from the driver gps_driver:= picks - ublox_gps (ublox, the default; Tentative, Q18), gps_nmea (nmea) or ublox_nav_sat_fix_hp (ublox_dgnss). ublox_gps publishes it reliable (depth 1), ublox_dgnss best-effort (SensorDataQoS), so subscribe best effort.
  /sensors/gps/fix_velocity:
    type: geometry_msgs/msg/TwistWithCovarianceStamped
    pub: [ublox_gps]
    sub: []
    note: The receiver's velocity, east, north and up (m/s). Nothing fuses it yet.
  /sensors/gps/vel:
    type: geometry_msgs/msg/TwistStamped
    pub: [gps_nmea]
    sub: []
    note: NMEA's speed and course (gps_driver:=nmea). Nothing fuses it yet.
  /sensors/gps/time_reference:
    type: sensor_msgs/msg/TimeReference
    pub: [gps_nmea]
    sub: []
    note: GPS time, from NMEA (gps_driver:=nmea).
  /sensors/radar/points:
    type: sensor_msgs/msg/PointCloud2
    pub: [radar, mock_radar, gazebo_adapter]
    sub: [radar_clusters, local_costmap, collision_monitor, sensor_watchdog]
    live: [bench, road]
    note: The TI radar's points, in radar_link, 10 Hz, an empty cloud when it sees nothing. Best effort - subscribe best effort, or nothing matches. Clustered by radar_clusters (aav_radar_clusters, Rust); read by the local costmap's obstacle layer and collision_monitor where it runs (navigation.launch.py radar:=true). In Gazebo's road world, gazebo_adapter makes them from a lidar shaped like the radar - the rays that hit something, with the TI driver's fields.
  /vehicle/battery:
    type: sensor_msgs/msg/BatteryState
    pub: [battery_state_publisher, mock_battery]
    sub: [hud_server, hud]
    live: [bench]
    note: battery_monitor's node is battery_state_publisher (the Victron VE.Direct cable).
  /vehicle/battery/heartbeat:
    type: std_msgs/msg/String
    pub: [heartbeat_publisher]
    sub: []
    note: battery_monitor's sign of life.
  /sensors/camera/front_left/image_raw:
    type: sensor_msgs/msg/Image
    pub: [camera_left, mock_camera, test_camera, gz_road_bridge, gazebo_adapter]
    sub: [yolo_detector, yolo_detector_orin, yolo_detector_laptop, yolo_detector_all, hud_server, lane_finder, hud, sensor_watchdog]
    live: [bench, road]
    note: The front camera (camera_left_link). Big messages - subscribe reliably, as best effort loses them over UDP. camera_left is usb_cam (car.launch.py's camera part, Linux only); mock_camera draws the bench world; test_camera publishes a file; gz_road_bridge brings Gazebo's camera, in the road world (the bench camera's picture and lens). With faults:=true, Gazebo's picture goes to gazebo_adapter first (Gazebo's own /gazebo/camera/front_left/image_raw), which passes it on through its camera fault (freeze, stop).
  /sensors/camera/front_left/image_raw/compressed:
    type: sensor_msgs/msg/CompressedImage
    pub: [camera_left, test_camera, mock_camera]
    sub: [yolo_detector, yolo_detector_laptop]
    note: The same pictures as JPEG, from image_transport's compressed plugin (usb_cam and image_publisher publish it by themselves; mock_camera only while something reads it). A detector on a laptop over WiFi reads this one (detector.launch.py compressed:=true; the laptop's machine file). On the bench, pixi run -e ml laptop-bench.
  /sensors/camera/front_left/camera_info:
    type: sensor_msgs/msg/CameraInfo
    pub: [camera_left, mock_camera, test_camera, gz_road_bridge]
    sub: [lane_finder, camera_obstacles]
    live: [bench, road]
    note: The lens. usb_cam reads aav_sensors/config/cameras/left.ini (the 2024-25 calibration). lane_finder takes its focal length and centre from here; camera_obstacles keeps each camera's by its frame_id.
  /sensors/camera/front_right/image_raw:
    type: sensor_msgs/msg/Image
    pub: [gz_road_bridge]
    sub: []
    live: [road]
    note: The front right camera, beside the left one (camera_right_link). Gazebo's only, in the road world, for now - the car's drivers come with camera_ros (audit N4). Subscribe reliably, as for the front left one.
  /sensors/camera/front_right/camera_info:
    type: sensor_msgs/msg/CameraInfo
    pub: [gz_road_bridge]
    sub: []
    live: [road]
    note: Its lens. In Gazebo, the same as the front left camera's.
  /sensors/camera/rear/image_raw:
    type: sensor_msgs/msg/Image
    pub: [gz_road_bridge]
    sub: []
    live: [road]
    note: The rear camera, looking back (the orange housing on the tailgate) (camera_rear_link). Gazebo's only, in the road world, for now - the car's drivers come with camera_ros (audit N4). Subscribe reliably, as for the front left one.
  /sensors/camera/rear/camera_info:
    type: sensor_msgs/msg/CameraInfo
    pub: [gz_road_bridge]
    sub: []
    live: [road]
    note: Its lens. In Gazebo, the same as the front left camera's.
  /sensors/lidar/points:
    type: sensor_msgs/msg/PointCloud2
    pub: [gz_lidar_bridge]
    sub: [lidar_scan]
    live: [road]
    note: Gazebo only for now - the car has a roof lidar (probably a Velodyne - the 2025-26 code read /velodyne_points), but we have no driver for it yet (audit N6), so car.launch.py's lidar:=false is the default. In Gazebo, a generic 16-beam roof lidar (like a VLP-16) in lidar_link, 10 Hz, 1800 x 16 points, 0.5-100 m, inf where a ray hit nothing. Reliable (about 0.9 MB a cloud). On by default in the road and test_lot worlds (lidar:=false turns it off). Its one reader for Nav2 is lidar_scan (navigation.launch.py lidar:=true), which flattens it into /sensors/lidar/scan.
  /sensors/lidar/scan:
    type: sensor_msgs/msg/LaserScan
    pub: [lidar_scan]
    sub: [local_costmap, collision_monitor]
    live: [road]
    note: The roof lidar flattened (aav_lidar lidar_scan - navigation.launch.py lidar:=true) - in base_link, 720 ranges all the way round, each the nearest point between 0.3 m and the roof plus 0.5 m (vehicle.obstacle_heights), inf where there is none. Best effort, 10 Hz. Read by the local costmap's lidar_layer and collision_monitor's stop zone. From the roof, the lowest beam (15 degrees down from 1.8 m) meets a 1 m box only 3 m away, so low things close in front are the radar's.

  # --- perception ---
  /perception/radar/clusters:
    type: sensor_msgs/msg/PointCloud2
    pub: [radar_clusters]
    sub: []
    live: [bench, road]
    note: The radar points DBSCAN grouped into objects (radar_clusters, aav_radar_clusters, Rust), coloured by cluster, with each point's cluster number in a cluster field; noise left out. The radar cloud's frame and time.
  /perception/radar/cluster_boxes:
    type: visualization_msgs/msg/MarkerArray
    pub: [radar_clusters]
    sub: []
    live: [bench, road]
    note: A box round each radar cluster, for RViz - a DELETEALL first, then one CUBE per cluster, its id the cluster number.
  /perception/detections:
    type: vision_msgs/msg/Detection2DArray
    pub: [yolo_detector, yolo_detector_orin, yolo_detector_laptop, yolo_detector_all]
    sub: [stop_sign_watcher, camera_obstacles]
    note: YOLO's boxes in pixels; header.frame_id names the camera, results[0].hypothesis is the label (e.g. "stop sign") and score. Needs PyTorch - the ml environment, or JetPack's on the Orin. yolo_detector in bench mode and pixi run detect; on the car yolo_detector_<machine>, one per machine with a GPU (car.launch.py's detector part), all on this topic. Not live in car yet - the Orin's waits for JetPack 7.2 (Q24); the laptop's reads the camera's compressed pictures (pixi run -e ml car laptop).
  /perception/detections/image:
    type: sensor_msgs/msg/Image
    pub: [yolo_detector, yolo_detector_orin, yolo_detector_laptop, yolo_detector_all]
    sub: []
    note: The camera picture with the boxes drawn on, for RViz or Foxglove.
  /perception/stop_sign:
    type: std_msgs/msg/Bool
    pub: [stop_sign_watcher]
    sub: [twist_mux, hud_server, hud, language_drive]
    live: [car]
    note: true while the car stops for a stop sign. A twist_mux lock at priority 30 - it holds Nav2 and the AI slot, never a person; never expires on silence. On the car, the stop_signs part - one watcher, on the machine with the mux.
  /perception/camera_obstacles:
    type: sensor_msgs/msg/PointCloud2
    pub: [camera_obstacles]
    sub: [local_costmap]
    note: Where each detected object stands on the road, in base_link (z = 0) - points 0.1 m apart along its box's bottom edge, out to 12 m from the camera, one cloud per detections message, from the camera its header names. Only the listed COCO classes (people, cyclists, cars...), never stop signs. The local costmap's camera layer marks them - bench.launch.py camera_obstacles:=true, or the car's camera_obstacles part next to navigation. Off until the cameras are calibrated (Q22).
  /perception/camera_view:
    type: sensor_msgs/msg/PointCloud2
    pub: [camera_obstacles]
    sub: [local_costmap]
    note: The far edge of what that camera sees, on the road, 12 m out, in base_link. The camera layer clears up to it before it marks, so old boxes don't linger.

  /perception/lane/geometry:
    type: aav_lane_geometry/msg/LaneGeometry
    pub: [lane_finder, fake_lane_geometry_pub]
    sub: [control_interface]
    note: "One per camera picture, from lane_finder (aav_lane_finder, classic OpenCV), in base_link. vehicle_offset_m - the car from the lane's centre, 3 m ahead (lookahead), + = the car is left of it. Each line as y = a x^2 + b x + c (m), its radius (m; 9999 = straight or not seen) and confidence (0-1); the lane width (m). Bench - lane:=true runs lane_finder, lane:=fake runs fake_lane_geometry_pub (its polynomials are pixels)."
  /perception/lane/image:
    type: sensor_msgs/msg/Image
    pub: [lane_finder]
    sub: []
    note: The bird's-eye view, with the paint, the windows and the lines lane_finder found, for RViz or Foxglove. Only with debug_image true.
  /drivers/ai/lane_status:
    type: std_msgs/msg/String
    pub: [control_interface]
    sub: []
    note: Lane keeping's state and numbers, as text. Under /drivers/ai, as control_interface (the AI slot's driver) publishes it.
  /drivers/ai/lane_state:
    type: std_msgs/msg/String
    pub: [control_interface]
    sub: []
    note: Lane keeping's state machine (LANE_KEEP, LANE_CHANGING, ...). Not the car's state - that's /vehicle/status.

  # --- bench mode: the stand-ins' own topics ---
  /vehicle/bench/truth:
    type: nav_msgs/msg/Odometry
    pub: [spine_sim]
    sub: [mock_imu, mock_gps, mock_camera, mock_radar]
    live: [bench]
    note: Where the model car really is (map frame, 50 Hz). Only the stand-ins read it; compare it with /localization/odom/global to check the EKFs.
  /vehicle/bench/hw_estop:
    type: std_msgs/msg/Bool
    pub: []
    sub: [spine_sim]
    note: true = press the hardware e-stop, on the bench; false = release it. The spine brakes, and needs arming again.
  /vehicle/bench/driver_faults:
    type: std_msgs/msg/UInt16
    pub: []
    sub: [spine_sim]
    note: Pretend a driver failed. Fault bits as in VehicleStatus (8 = steering, 16 = brake, 32 = throttle DAC, 64 = encoder).

  # --- Gazebo's road world: the simulator's own ---
  /vehicle/gazebo/truth:
    type: nav_msgs/msg/Odometry
    pub: [gz_road_bridge]
    sub: []
    live: [road]
    note: Where the Gazebo car really is (map frame - the world's origin is the datum - 50 Hz), like the bench's /vehicle/bench/truth. Nothing on the car's side reads it; tools/sim_check.py compares it with /localization/odom/global. Gazebo's other topics (/gazebo/odom, imu, navsat, cmd_vel, radar/points) only link the bridges and gazebo_adapter.

  # --- localization ---
  /localization/odom/local:
    type: nav_msgs/msg/Odometry
    pub: [ekf_local]
    sub: [controller_server, bt_navigator, scripted_driver, language_drive, actuator_test, sensor_watchdog]
    live: [turtle, sim, car, replay, bench]
    note: odom frame. Smooth; drifts.
  /localization/odom/global:
    type: nav_msgs/msg/Odometry
    pub: [ekf_global]
    sub: [navsat_transform, map, sensor_watchdog]
    live: [sim, car, replay, bench]
    note: map frame. Includes GPS; can jump. The map window (map, aav_hud_raylib) draws the car from it.
  /localization/gps/odom:
    type: nav_msgs/msg/Odometry
    pub: [navsat_transform]
    sub: [ekf_global]
    live: [sim, car, replay, bench]
    note: Each GPS fix as a map-frame position of base_link (antenna offset removed).
  /localization/gps/fix:
    type: sensor_msgs/msg/NavSatFix
    pub: [navsat_transform]
    sub: [hud_server, hud, street_router]
    live: [sim, car, replay, bench]
    note: The global EKF's position as lat/lon, for maps in the HUD or Foxglove, and the start of street_router's routes.

  # --- navigation ---
  /map:
    type: nav_msgs/msg/OccupancyGrid
    pub: [map_server]
    sub: [global_costmap, local_costmap, map]
    live: [sim]
    note: Transient local (latched). From aav_navigation/maps. The map window (map, aav_hud_raylib) draws it north up, for the big screen.
  /goal_pose:
    type: geometry_msgs/msg/PoseStamped
    pub: [rviz2, map]
    sub: [bt_navigator, map]
    note: RViz "2D Goal Pose", or the map window's place search (map, aav_hud_raylib - only after DRIVE HERE then CONFIRM, map frame, facing from the car, refused off Nav2's /map or with no car), starts a navigate_to_pose. The map window shows it until Nav2 plans for it.
  /plan:
    type: nav_msgs/msg/Path
    pub: [planner_server]
    sub: [map]
    note: The planned path, for RViz/Foxglove, and the map window (map, aav_hud_raylib) - the line, the goal (its last point) and the distance left along it. Nav2 plans again every second while it drives.

  # --- street routes (aav_routes, docs/routes.md): for real streets later, the lot first ---
  /drivers/nav/route/destination:
    type: geographic_msgs/msg/GeoPointStamped
    pub: []
    sub: [street_router]
    note: Where to go, as lat/lon (ros2 topic pub, or a screen). street_router asks the router (Valhalla on this computer, pixi run -e routes router) for the way there along the streets, from the car's newest /localization/gps/fix.
  /drivers/nav/route/goal:
    type: geometry_msgs/msg/PoseStamped
    pub: []
    sub: [street_router]
    note: Where to go, as a map-frame point (RViz, or a screen); street_router turns it into lat/lon with /toLL, then as /drivers/nav/route/destination.
  /drivers/nav/route/waypoints:
    type: geographic_msgs/msg/GeoPath
    pub: [street_router]
    sub: []
    note: Transient local (latched). The route as GPS waypoints spaced for Nav2 (10-30 m apart, each facing along the street, the car's own start left out) - what /drivers/nav/route/follow sends to /follow_gps_waypoints.
  /drivers/nav/route/path:
    type: nav_msgs/msg/Path
    pub: [street_router]
    sub: [map]
    note: Transient local (latched). The whole route in the map frame (each point through /fromLL). The map window (map, aav_hud_raylib) draws it violet under Nav2's blue plan; RViz and Foxglove can too. Not a plan Nav2 follows.
  /drivers/nav/route/status:
    type: std_msgs/msg/String
    pub: [street_router]
    sub: []
    note: Transient local (latched). For people - the route's length and the router's time for a normal car, or why there's no route (no router, no GPS fix, longer than max_length).

  # --- frames and plumbing ---
  /tf:
    type: tf2_msgs/msg/TFMessage
    pub: [ekf_local, ekf_global, robot_state_publisher]
    sub: []
    live: [turtle, sim, car, replay, bench]
    note: map -> odom (ekf_global), odom -> base_link (ekf_local), moving joints (robot_state_publisher).
  /tf_static:
    type: tf2_msgs/msg/TFMessage
    pub: [robot_state_publisher, map_to_odom_no_gps]
    sub: []
    live: [turtle, sim, car, replay, bench]
    note: base_link -> chassis and every sensor frame, from vehicle.yaml through the URDF. With gps:=false, map_to_odom_no_gps adds a fixed map -> odom.
  /robot_description:
    type: std_msgs/msg/String
    pub: [robot_state_publisher]
    sub: []
    live: [turtle, sim, car, replay, bench]
  /clock:
    type: rosgraph_msgs/msg/Clock
    pub: [gz_bridge]
    sub: []
    live: [sim, replay]
    note: Simulation time; every node runs with use_sim_time:=true in sim and replay.
  /diagnostics:
    type: diagnostic_msgs/msg/DiagnosticArray
    pub: [twist_mux, ekf_local, ekf_global, sensor_watchdog]
    sub: [language_drive]
    note: ROS's diagnostics. sensor_watchdog reports each input it watches once a second (OK, WARN, ERROR when it stops the car); for the wheels, also the gaps to the IMU (speed_gap, turn_gap, worst_speed_gap, worst_turn_gap), to tune the cross check on the car. twist_mux reports each lock once a second ("lock locks.estop" locked or free) - the only place a node started after an e-stop can learn it, since /safety/estop is sent a few times and its senders go away. language_drive refuses to move while it says locked, or while it is silent. pixi run check ignores the topic.

services:
  /spine/arm:
    type: std_srvs/srv/SetBool
    server: spine_bridge
    note: The spine ignores drive commands until armed; refused while /safety/estop is true.
  /fromLL:
    type: robot_localization/srv/FromLL
    server: navsat_transform
    note: Lat/lon -> map x, y. Nav2's follow_gps_waypoints calls it, and street_router, for /drivers/nav/route/path.
  /toLL:
    type: robot_localization/srv/ToLL
    server: navsat_transform
    note: Map x, y -> lat/lon. street_router calls it for /drivers/nav/route/goal.
  /datum:
    type: robot_localization/srv/SetDatum
    server: navsat_transform
    note: Move the map origin (normally set once from navsat.yaml).
  /ekf_local/set_pose:
    type: robot_localization/srv/SetPose
    server: ekf_local
  /ekf_global/set_pose:
    type: robot_localization/srv/SetPose
    server: ekf_global
    note: Re-seed the start pose by hand (heading!).
  /safety/sensor_watchdog/clear:
    type: std_srvs/srv/Trigger
    server: sensor_watchdog
    note: A person says the position is right again after a GPS jump, which the watchdog latches (pixi run sim-fault clear in Gazebo).
  /drivers/nav/route/follow:
    type: std_srvs/srv/Trigger
    server: street_router
    note: A person sends street_router's newest route to Nav2, as a /follow_gps_waypoints goal. Nothing goes to Nav2 without it (unless follow_at_once is set). Nav2, twist_mux, ego and the spine stay in charge.

actions:
  /scripted_drive:
    type: aav_interfaces/action/ScriptedDrive
    server: scripted_driver
    note: Drive a speed profile (accelerate, hold for a time or distance, stop). Phase 1. Sent by language_drive (aav_language) for drive() and turn() - a whole distance, ramps included.
  /navigate_to_pose:
    type: nav2_msgs/action/NavigateToPose
    server: bt_navigator
    note: Drive to one map-frame pose.
  /navigate_through_poses:
    type: nav2_msgs/action/NavigateThroughPoses
    server: bt_navigator
  /follow_waypoints:
    type: nav2_msgs/action/FollowWaypoints
    server: waypoint_follower
  /follow_gps_waypoints:
    type: nav2_msgs/action/FollowGPSWaypoints
    server: waypoint_follower
    note: Lat/lon waypoints. The HUD (hud_server) sends its locked route here, and street_router its street route on /drivers/nav/route/follow. Phase 2. language_drive (aav_language) sends one point for go_to_gps(), at most 200 m away.

frames:
  map: {parent: null, by: "ekf_global (map -> odom)", note: "x east, y north; origin = the navsat datum"}
  odom: {parent: map, by: "ekf_local (odom -> base_link)", note: "continuous; starts where the car starts"}
  base_link: {parent: odom, note: "on the ground under the rear axle centre; x forward, y left, z up"}
  chassis: {parent: base_link, by: robot_state_publisher}
  imu_link: {parent: base_link, by: robot_state_publisher, note: "vehicle.yaml sensors.imu_link"}
  gps_link: {parent: base_link, by: robot_state_publisher, note: "the antenna"}
  radar_link: {parent: base_link, by: robot_state_publisher}
  camera_left_link: {parent: base_link, by: robot_state_publisher}
  camera_right_link: {parent: base_link, by: robot_state_publisher}
  camera_rear_link: {parent: base_link, by: robot_state_publisher, note: "turned 180 degrees: it looks back"}
  lidar_link: {parent: base_link, by: robot_state_publisher, note: "the roof lidar"}
