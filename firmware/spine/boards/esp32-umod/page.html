<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>spine: status</title>
<!-- Served by the ESP32 with `wifi-status` (read only), or by tools/esp32_status_sim.py.
     It reads the status lines (firmware/status) from the WebSocket /ws; ?ws=<url> picks
     another. It sends nothing. -->
<style>
.viz-root{color-scheme:light;--surface-1:#fcfcfb;--page:#f9f9f7;--ink:#0b0b0b;--ink-2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--band:rgba(42,120,214,.16);--warn:#b45309}
@media (prefers-color-scheme:dark){.viz-root{color-scheme:dark;--surface-1:#1a1a19;--page:#0d0d0d;--ink:#f0efec;--ink-2:#c3c2b7;--grid:#2c2c2a;--axis:#383835;--s1:#3987e5;--s2:#d95926;--band:rgba(57,135,229,.22);--warn:#f59e0b}}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
.viz-root{background:var(--page);color:var(--ink);min-height:100vh;padding:12px;box-sizing:border-box}
h1{font-size:16px;margin:0 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
button,select,input{font:inherit;color:inherit;background:var(--surface-1);border:1px solid var(--axis);border-radius:6px;padding:4px 10px}
#state{color:var(--ink-2);font-variant-numeric:tabular-nums}
.warn{color:var(--warn);font-weight:600}
.card{background:var(--surface-1);border:1px solid rgba(127,127,127,.18);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.card h2{font-size:14px;margin:0 0 4px;display:flex;gap:14px;align-items:baseline}
.key{font-weight:400;color:var(--ink-2);font-size:12px}
.key i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:4px}
canvas{width:100%;height:150px;display:block}
#tip{position:fixed;pointer-events:none;background:var(--surface-1);color:var(--ink);border:1px solid var(--axis);border-radius:6px;padding:4px 8px;font-size:12px;display:none;font-variant-numeric:tabular-nums}
#lines{font:12px ui-monospace,Menlo,monospace;white-space:pre;overflow:auto;max-height:220px;color:var(--ink-2)}
#banner{font-size:28px;font-weight:700;padding:14px 16px;border-radius:8px;margin-bottom:6px;color:#fff;background:#6b6a66}
#banner .why{display:block;font-size:15px;font-weight:400;margin-top:2px}
#banner.ok{background:#1a7f37}#banner.wait{background:#8a6d00}#banner.bad{background:#b42318}
#devices{margin-bottom:10px;font-size:15px}
#devices .miss{color:#b42318;font-weight:700}
</style>
</head>
<body>
<div class="viz-root">
<div id="banner">Pi link: waiting for the board<span class="why">no line yet</span></div>
<div id="devices">Devices: not heard yet (the board says them at boot and every 10 s)</div>
<h1>Spine status <span class="key">read only: this page sends nothing</span></h1>
<div class="bar">
  <button id="pause">Pause</button>
  <label>Window <select id="win"><option value="30">30 s</option><option value="120">2 min</option><option value="10">10 s</option></select></label>
  <label>Lines <input id="filter" placeholder="filter, e.g. event" size="18"></label>
  <span id="state">connecting...</span>
</div>
<div id="charts"></div>
<div class="card"><h2>Lines <span class="key" id="count"></span></h2><div id="lines"></div></div>
<div id="tip"></div>
</div>
<script>
"use strict";
// One graph a device, two lines each: what the firmware asked, and where the Jrk is.
// The shaded band is the lowest and highest asked between two lines (`low`, `high`).
const GRAPHS = [
  {key: "steer_counts", pos: "steer", title: "Steering (counts)"},
  {key: "brake_counts", pos: "brake", title: "Brake (counts)"},
  {key: "dac", pos: null, title: "Throttle (DAC code; no sensor)"},
];
const KEEP = 200 * 20;           // status lines kept: 200 s at 20 a second
const SHOWN = 200;               // raw lines listed
const $ = id => document.getElementById(id);
let rows = [], raw = [], paused = false, lastSeq = null, lost = 0, hb = null, status = null;
let health = null, devices = null, heardAt = 0;
// The Pi link's verdict (firmware/status: link.verdict), in big words. Judged on the board.
const BANNER = {
  ok: ["ok", "Pi link: OK", "frames with the Orin's counter moving"],
  no_frames: ["wait", "Pi link: NO FRAMES", "right while the Pi's bridge is off"],
  stale: ["bad", "Pi link: STALE", "frames came, then stopped"],
  counter_frozen: ["bad", "COUNTER FROZEN: is the mux running?", "the Pi sends, but the Orin's counter doesn't move"],
  bad_frames: ["bad", "BAD FRAMES", "the cable, the baud, or frame_version in legacy.yaml"],
};

const css = n => getComputedStyle(document.querySelector(".viz-root")).getPropertyValue(n).trim();
const charts = GRAPHS.map(g => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<h2>${g.title}<span class="key"><i style="background:var(--s1)"></i>asked</span>` +
    (g.pos ? `<span class="key"><i style="background:var(--s2)"></i>position</span>` : "") +
    `<span class="key">band: low to high between lines</span></h2><canvas></canvas>`;
  $("charts").appendChild(card);
  const c = {g, canvas: card.querySelector("canvas"), hover: null};
  c.canvas.addEventListener("mousemove", e => { c.hover = e; draw(); });
  c.canvas.addEventListener("mouseleave", () => { c.hover = null; $("tip").style.display = "none"; draw(); });
  return c;
});

function take(text) {
  let m;
  try { m = JSON.parse(text); } catch (e) { return; }
  if (typeof m.seq === "number") {
    if (lastSeq !== null && m.seq > lastSeq + 1) { lost += m.seq - lastSeq - 1; rows.push({gap: true}); }
    if (lastSeq !== null && m.seq <= lastSeq) rows.push({gap: true});   // a reboot, or a new stream
    lastSeq = m.seq;
  }
  raw.push(text); if (raw.length > SHOWN * 5) raw.splice(0, raw.length - SHOWN * 5);
  if (m.schema !== 1) { $("state").innerHTML = `<span class="warn">schema ${m.schema} unknown: values not shown</span>`; return; }
  heardAt = Date.now();
  if (m.t === "hb") hb = m;
  if (m.t === "health") health = m;
  if (m.t === "devices") devices = m;
  if (m.t === "status") {
    status = m;
    rows.push({t: Date.now() / 1000, up: m.up_ms, out: m.out || {}, low: m.low || {}, high: m.high || {}, pos: m.pos || {}});
    if (rows.length > KEEP) rows.splice(0, rows.length - KEEP);
  }
}

function banner() {
  const b = $("banner"), v = status && status.link ? status.link.verdict : undefined;
  let [cls, text, why] = ["", "Pi link: waiting for the board", "no line yet"];
  if (heardAt && Date.now() - heardAt > 3000) [cls, text, why] = ["bad", "NO LINES FROM THE BOARD", "for over 3 s: the WiFi, or the board restarted"];
  else if (v === null) [cls, text, why] = ["", "Pi link: not judged here", "a CAN build: the Orin's spine_bridge judges it"];
  else if (v in BANNER) [cls, text, why] = BANNER[v];
  if (v === "stale" && status.rx) why += `: the last ${status.rx.age_ms} ms ago`;
  b.className = cls;
  b.textContent = "";
  b.append(text);
  const s = document.createElement("span"); s.className = "why"; s.textContent = why; b.append(s);
  const d = $("devices");
  if (devices && Array.isArray(devices.list)) {
    d.innerHTML = `<b>Devices ${devices.answered}/${devices.expected}</b> at boot: ` + devices.list.map(x =>
      `<span class="${x.answered ? "" : "miss"}">${x.name} 0x${x.address.toString(16).padStart(2, "0")} ` +
      `${x.answered ? "answered" : "MISSING"}${x.feedback ? ", feedback " + x.feedback : ""}</span>`).join(" · ");
  } else if (health && health.devices) {
    const h = health.devices;
    d.innerHTML = `<b>Devices ${h.answered}/${h.expected}</b>` + (h.missing.length ? ` <span class="miss">missing: ${h.missing.join(", ")}</span>` : "");
  }
}

function header() {
  const s = status && status.state, l = status && status.link, k = status && status.tick, r = status && status.rx;
  const parts = [];
  if (s) parts.push(`mode ${s.mode}`, s.armed ? "armed" : "not armed", s.estop ? "E-STOP" : "no e-stop", `faults ${s.faults}`);
  if (r) parts.push(`last frame v${r.v} #${r.counter} ${r.age_ms} ms ago`); else if (status) parts.push("no frame yet");
  if (l) parts.push(`frames ${l.frames} bad ${l.bad} skipped ${l.skipped} repeats ${l.repeats}`);
  if (k) parts.push(`worst tick gap ${(k.worst_gap_us / 1000).toFixed(1)} ms, ${k.overruns} late`);
  if (hb) parts.push(`build ${hb.build}`);
  parts.push(`${lost} lines lost`);
  if (paused) parts.push("PAUSED");
  $("state").textContent = parts.join(" · ");
}

function draw() {
  const win = +$("win").value, now = rows.length ? rows[rows.length - 1].t : Date.now() / 1000;
  const shown = rows.filter(r => r.gap || r.t >= now - win);
  for (const c of charts) plot(c, shown, now - win, now);
  const f = $("filter").value.trim();
  const list = (f ? raw.filter(t => t.includes(f)) : raw).slice(-SHOWN);
  $("lines").textContent = list.join("\n");
  $("count").textContent = f ? `${list.length} shown, filtered by "${f}"` : `the last ${list.length}`;
  header();
  banner();
}

function plot(c, shown, t0, t1) {
  const cv = c.canvas, dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  const x = cv.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, w, h);
  const k = c.g.key, p = c.g.pos, L = 44, R = 8, T = 6, B = 18;
  const vals = [];
  for (const r of shown) if (!r.gap) { for (const v of [r.out[k], r.low[k], r.high[k], p && r.pos[p]]) if (typeof v === "number") vals.push(v); }
  let lo = vals.length ? Math.min(...vals) : 0, hi = vals.length ? Math.max(...vals) : 1;
  if (hi - lo < 10) { lo -= 5; hi += 5; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const X = t => L + (t - t0) / (t1 - t0 || 1) * (w - L - R), Y = v => T + (hi - v) / (hi - lo) * (h - T - B);
  x.font = "11px system-ui,sans-serif"; x.fillStyle = css("--muted"); x.strokeStyle = css("--grid"); x.lineWidth = 1;
  for (let i = 0; i <= 3; i++) {
    const v = lo + (hi - lo) * i / 3, y = Math.round(Y(v)) + 0.5;
    x.beginPath(); x.moveTo(L, y); x.lineTo(w - R, y); x.stroke();
    x.textAlign = "right"; x.fillText(Math.round(v), L - 6, y + 4);
  }
  x.textAlign = "center"; x.fillText(`${Math.round(t1 - t0)} s`, L + 12, h - 4); x.fillText("now", w - R - 12, h - 4);
  // The band, then the two lines; a gap in seq breaks them.
  x.fillStyle = css("--band");
  segments(shown, r => typeof r.low[k] === "number").forEach(seg => {
    x.beginPath(); seg.forEach((r, i) => i ? x.lineTo(X(r.t), Y(r.high[k])) : x.moveTo(X(r.t), Y(r.high[k])));
    for (let i = seg.length - 1; i >= 0; i--) x.lineTo(X(seg[i].t), Y(seg[i].low[k]));
    x.closePath(); x.fill();
  });
  const line = (get, color) => {
    x.strokeStyle = color; x.lineWidth = 2; x.lineJoin = "round";
    segments(shown, r => typeof get(r) === "number").forEach(seg => {
      x.beginPath(); seg.forEach((r, i) => i ? x.lineTo(X(r.t), Y(get(r))) : x.moveTo(X(r.t), Y(get(r)))); x.stroke();
    });
  };
  line(r => r.out[k], css("--s1"));
  if (p) line(r => r.pos[p], css("--s2"));
  if (c.hover && shown.length) {
    const b = cv.getBoundingClientRect(), mx = c.hover.clientX - b.left;
    let best = null;
    for (const r of shown) if (!r.gap && (!best || Math.abs(X(r.t) - mx) < Math.abs(X(best.t) - mx))) best = r;
    if (best) {
      x.strokeStyle = css("--axis"); x.lineWidth = 1; x.beginPath(); x.moveTo(X(best.t), T); x.lineTo(X(best.t), h - B); x.stroke();
      const tip = $("tip");
      tip.innerHTML = `up ${(best.up / 1000).toFixed(2)} s<br>asked ${best.out[k]} (low ${best.low[k]}, high ${best.high[k]})` +
        (p ? `<br>position ${best.pos[p] === null || best.pos[p] === undefined ? "not known" : best.pos[p]}` : "");
      tip.style.display = "block"; tip.style.left = (c.hover.clientX + 14) + "px"; tip.style.top = (c.hover.clientY + 10) + "px";
    }
  }
}

function segments(shown, ok) {
  const out = []; let cur = [];
  for (const r of shown) { if (r.gap || !ok(r)) { if (cur.length) out.push(cur); cur = []; } else cur.push(r); }
  if (cur.length) out.push(cur);
  return out;
}

function connect() {
  const url = new URLSearchParams(location.search).get("ws") || `ws://${location.host}/ws`;
  const ws = new WebSocket(url);
  ws.onmessage = e => take(e.data);   // paused or not: pause only freezes the view
  ws.onclose = () => { $("state").textContent = "disconnected: trying again in 2 s"; setTimeout(connect, 2000); };
}

$("pause").onclick = () => { paused = !paused; $("pause").textContent = paused ? "Resume" : "Pause"; draw(); };
$("win").onchange = $("filter").oninput = draw;
setInterval(() => { if (!paused) draw(); }, 200);
connect();
</script>
</body>
</html>
