[package]
name = "spine-pico2"
description = "The spine's board program for a Raspberry Pi Pico 2 (RP2350) on the bench: spine-board and spine-core on the chip's peripherals, with an MCP2515 for CAN."
version = "0.1.0"
edition = "2021"
license = "TODO"
publish = false

# A workspace of its own, not a member of firmware/spine's: it builds only for the
# RP2350 (thumbv8m.main-none-eabihf, set in .cargo/config.toml), with Embassy's HAL for
# that chip, while the members build and test on any laptop.
[workspace]

[dependencies]
# Ours: the logic, the glue, and the drivers (firmware/spine/crates).
spine-core = { path = "../../crates/spine-core" }
spine-board = { path = "../../crates/spine-board" }
mcp2515 = { path = "../../crates/mcp2515" }
ibus = { path = "../../crates/ibus" }

# Embassy for the RP2350 (the Pico 2 has the RP2350A). unstable-pac: for the one
# watchdog register embassy-rp sets for the RP2040 (src/main.rs).
embassy-rp = { version = "0.10.0", features = ["rp235xa", "time-driver", "critical-section-impl", "unstable-pac", "defmt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = "0.8.0"
# One I2C bus for four devices, and the MCP2515's SPI with its CS pin.
embedded-hal = "1.0.0"
embedded-hal-bus = "0.3.0"
static_cell = "2.1.1"

cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
# Logs and panics over a debug probe (probe-rs); without one they go nowhere.
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.release]
debug = 2          # symbols for probe-rs and defmt; they never reach the flash image
lto = true
codegen-units = 1
