; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform  = espressif32@6.3.2
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

extra_scripts = pre:extra_includes.py

build_flags =
    -I src/modules
    -I src/modules/dac
    -I src/modules/jrk_g2
    -I src/modules/rc_handler
    -I src/modules/ros2_handler
    -I src/modules/web_handler
    -I src/modules/websoc_serial
    -DWEBSOCKETS_NETWORK_TYPE=NETWORK_ESP32

lib_extra_dirs =
    ~/.platformio/packages/framework-arduinoespressif32@3.20009.0/libraries

lib_deps =
    SPI
    Wire
    WiFi
    SPIFFS
    Update
    WebServer
    HTTPUpdateServer
    WiFiClientSecure
    bmellink/IBusBM@^1.1.4
    pololu/JrkG2@^1.1.0
    hideakitai/PCA95x5@^0.1.3
    links2004/WebSockets@^2.7.3

lib_ldf_mode = deep+
lib_compat_mode = off

