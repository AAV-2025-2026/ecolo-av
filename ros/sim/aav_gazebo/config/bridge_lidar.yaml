# The simulated roof lidar (lidar:=true, in a world that renders sensors: the road world).
# Its own bridge, gz_lidar_bridge, so it starts only when the lidar is there. Gazebo topic:
# aav_description/urdf/aav.sensors.gazebo.xacro. ros_gz 1.0.24.
#
# One point per ray, 1800 x 16 at 10 Hz (about 0.9 MB a cloud), inf where a ray hit
# nothing, in lidar_link. Reliable, like the camera: a cloud this big is cut into many
# UDP pieces, and best effort loses the whole cloud when one piece is lost (docs/mac.md).
- ros_topic_name: /sensors/lidar/points
  gz_topic_name: /aav/lidar/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
