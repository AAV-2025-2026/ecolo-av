# ros_gz_bridge (ros_gz 1.0.24, Jazzy + Gazebo Harmonic). Format and type pairs checked in
# ros_gz_bridge/README.md. Topic names on the Gazebo side are set in
# aav_description/urdf/aav.gazebo.xacro and worlds/test_lot.sdf.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /gazebo/cmd_vel
  gz_topic_name: /model/aav/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ

- ros_topic_name: /gazebo/odom
  gz_topic_name: /model/aav/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS

- ros_topic_name: /gazebo/imu
  gz_topic_name: /aav/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS

- ros_topic_name: /gazebo/navsat
  gz_topic_name: /aav/navsat
  ros_type_name: sensor_msgs/msg/NavSatFix
  gz_type_name: gz.msgs.NavSat
  direction: GZ_TO_ROS

# The JointStatePublisher system's default topic: /world/<world>/model/<model>/joint_state
# (every world file is named "aav")
- ros_topic_name: /joint_states
  gz_topic_name: /world/aav/model/aav/joint_state
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS

# Where the car really is, in the map frame, in every world: for checks (sim_check.py), like the bench's /vehicle/bench/truth.
- ros_topic_name: /vehicle/gazebo/truth
  gz_topic_name: /model/aav/truth
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
