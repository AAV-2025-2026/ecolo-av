[package]
name = "sim-core"
description = "Our own simulator's core, with no ROS and no Bevy: the worlds Gazebo reads, the car, the lidar, IMU and GPS"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Reads Gazebo's world files (SDF is XML).
roxmltree = "0.20"
# The shared car model (ours: aav_description's car-model), behind CarModel: feature
# `shared` (src/shared_car.rs). cargo test -p sim-core --features shared.
car-model = { path = "../../../../bringup/aav_description/car-model", optional = true }

[features]
shared = ["dep:car-model"]
