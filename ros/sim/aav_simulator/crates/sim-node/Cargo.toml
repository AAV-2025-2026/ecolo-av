[package]
name = "sim-node"
description = "simulator: our own simulator as a ROS 2 node, a drop-in for gz sim and its bridges"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "simulator"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# SIGINT, plus SIGTERM and SIGHUP: rclrs 0.8 has no signal handling of its own yet.
ctrlc = { version = "3", features = ["termination"] }
rclrs = "0.8"
# The message types: compiled from the Rust code that ships with Jazzy (AMENT_PREFIX_PATH).
ros-env = "0.3"
sim-core = { path = "../sim-core" }
