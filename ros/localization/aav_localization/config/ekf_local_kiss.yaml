# ekf_local with KISS-ICP (kiss_ekf:=true, a trial): read on top of ekf_local.yaml.
#
# KISS-ICP (aav_kiss_icp) matches each lidar turn to the last few and publishes how the
# car moved: /localization/kiss_icp/odom. Here ekf_local takes its TWIST, beside the
# wheels and the IMU: vx (forward speed) and vyaw (turn rate), in base_link.
#
# Why the twist, not the pose:
#   - its pose drifts and lives in its own frame (kiss_odom, where the first scan was);
#     two drifting poses fighting in one filter pull it about;
#   - its pose restarts from where the last worker left it if the worker dies;
#   - a speed is what the wheels and the IMU give too: three opinions of the same thing.
#   vy is left out: the wheels already say 0 (a car can't slide sideways at the rear axle).
#
# If KISS-ICP stops (no lidar, the worker dies, kiss_icp not running) the filter simply
# gets no odom1: the wheels and the IMU carry on as without this file.
#
# Order of the 15 numbers, as in ekf_local.yaml:
#   x, y, z,  roll, pitch, yaw,  vx, vy, vz,  vroll, vpitch, vyaw,  ax, ay, az
# Results and the reasons for the numbers: docs/trials.md (KISS-ICP into the local EKF).
ekf_local:
  ros__parameters:
    odom1: /localization/kiss_icp/odom
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 5
    # The covariance is KISS-ICP's node's (fixed: 0.05 m/s and 0.02 rad/s, 1 sigma;
    # checked against Gazebo's truth: docs/trials.md). A twist more than 5 sigma from
    # the filter's (2 numbers: 99.9 % of honest ones are within 3.7) is refused: a slip
    # of the match, or the zero twist of a worker that has just restarted.
    odom1_twist_rejection_threshold: 5.0
    # The twist carries the cloud's stamp and arrives a few ms late (the match). Not put
    # back in time (no smooth_lagged_data, unlike ekf_global with NDT): a speed 20 ms old
    # is today's speed to within millimetres per second.
