[package]
name = "costmap-node"
description = "costmap: the ROS 2 node around the costmap crate, beside Nav2's costmaps"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "costmap"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# SIGINT, plus SIGTERM and SIGHUP: rclrs 0.8 has no signal handling of its own yet.
ctrlc = { version = "3", features = ["termination"] }
costmap = { path = "../costmap" }
rclrs = "0.8"
# The message types: compiled from the Rust code that ships with Jazzy (AMENT_PREFIX_PATH).
ros-env = "0.3"
# The launch file hands each costmap's nav2.yaml block over as one JSON parameter.
serde_json = "1"
