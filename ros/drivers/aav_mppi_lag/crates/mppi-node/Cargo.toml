[package]
name = "mppi-node"
description = "mppi_lag: the ROS 2 node around mppi-lag, in controller_server's FollowPath place"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mppi_lag"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# SIGINT, plus SIGTERM and SIGHUP: rclrs 0.8 has no signal handling of its own yet.
ctrlc = { version = "3", features = ["termination"] }
# The one-shot channel between the action's task and the tick.
futures = "0.3"
mppi-lag = { path = "../mppi-lag" }
rclrs = "0.8"
# The message types: compiled from the Rust code that ships with Jazzy (AMENT_PREFIX_PATH).
ros-env = "0.3"
