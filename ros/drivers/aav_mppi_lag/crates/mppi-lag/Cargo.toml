[package]
name = "mppi-lag"
description = "MPPI path following (ported from Nav2) on a car model that knows its actuators' lag"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# No dependencies by default: the random numbers and the threads are std and our own
# (src/rng.rs). The feature `shared` adds the shared car model (crate car-model, ours),
# behind CarModel (src/shared.rs): cargo test -p mppi-lag --features shared.
[dependencies]
car-model = { path = "../../../../bringup/aav_description/car-model", optional = true }

[features]
shared = ["dep:car-model"]
