[package]
name = "planner-node"
description = "planner: the ROS 2 node around the lattice-planner crate, beside Nav2's planner_server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "planner"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# SIGINT, plus SIGTERM and SIGHUP: rclrs 0.8 has no signal handling of its own yet.
ctrlc = { version = "3", features = ["termination"] }
# The one-shot channel from the planning thread back to the action's task.
futures = "0.3"
lattice-planner = { path = "../lattice-planner" }
costmap = { path = "../../../aav_costmap/crates/costmap" }
rclrs = "0.8"
# The message types: compiled from the Rust code that ships with Jazzy (AMENT_PREFIX_PATH).
ros-env = "0.3"
# The launch file hands the settings over as one JSON parameter.
serde_json = "1"
