[workspace]
resolver = "2"
# yahboom-protocol: the frames and units. Needs no ROS: `cargo test -p yahboom-protocol`.
# imu-node: the ROS node (rclrs). colcon builds it through CMakeLists.txt.
members = ["crates/yahboom-protocol", "crates/imu-node"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
