# pixi run test on GitHub's computers, so "it works on my machine" can't creep in.
#   Linux (Ubuntu 24.04, like the car): every push and every pull request.
#   Mac (Apple Silicon): every night, and on demand from the Actions tab. Mac minutes use
#   up a private repo's free allowance much faster than Linux ones, so not on every push.
#   64-bit ARM Linux (the car's Orin and Pis): the same tests on every push and pull
#   request (job arm), and the car kit made and installed offline (job car-kit).
# The Pixi version matches the one that wrote pixi.lock; raise both together.
# A failed test step prints each failing test as an annotation (tools/ci_annotate.py):
# GitHub's API shows those to anyone, the job's log only to people signed in.
name: test

on:
  # main only: a push of a helper's half-done branch (wt/*, archive/*) mailed a failure
  # each time. A pull request still tests its branch.
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each pull request on top of main and the ones ahead of it.
  merge_group:
  schedule:
    - cron: "0 7 * * *"   # 03:00 in Ottawa (EDT)
  workflow_dispatch:

# shell: bash means bash -eo pipefail, so a failed test fails through tee too.
defaults:
  run:
    shell: bash

env:
  PIXI_VERSION: v0.81.0
  # GitHub's Ubuntu runners ship PowerShell and set PSModulePath, so colcon takes PowerShell
  # for its shell and sets each package's environment from package.ps1: our own packages'
  # paths then never reach a build (aav_hud_raylib's cargo found no aav_interfaces). Empty,
  # colcon uses sh, as on a laptop.
  PSModulePath: ""

jobs:
  linux:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/rattler/cache/pkgs
          key: pixi-pkgs-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          restore-keys: pixi-pkgs-${{ runner.os }}-
      - name: pixi run test
        # A hung test fails the step (and so gets annotated) instead of the job being
        # cancelled at its limit with nothing to read; pytest prints every thread's stack
        # once a test has run 5 min (the Mac nightly of 24 Oct ran past 90 min).
        timeout-minutes: 45
        env:
          PYTEST_ADDOPTS: -o faulthandler_timeout=300
        run: pixi run --locked test 2>&1 | tee test.log
      - name: Failures as annotations (readable without signing in)
        # Not when the run failed before the tests (GitHub down, say): no test.log.
        if: (failure() || cancelled()) && hashFiles('test.log') != ''
        run: python3 tools/ci_annotate.py test.log build
      - name: The MCP server, over stdio
        run: pixi run --locked -e mcp python3 tools/tests/mcp_smoke.py

  mac:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install Pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v5
        with:
          path: ~/Library/Caches/rattler/cache/pkgs
          key: pixi-pkgs-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          restore-keys: pixi-pkgs-${{ runner.os }}-
      - name: pixi run test
        # A hung test fails the step (and so gets annotated) instead of the job being
        # cancelled at its limit with nothing to read; pytest prints every thread's stack
        # once a test has run 5 min (the Mac nightly of 24 Oct ran past 90 min).
        timeout-minutes: 45
        env:
          PYTEST_ADDOPTS: -o faulthandler_timeout=300
        run: pixi run --locked test 2>&1 | tee test.log
      - name: Failures as annotations (readable without signing in)
        # Not when the run failed before the tests (GitHub down, say): no test.log.
        if: (failure() || cancelled()) && hashFiles('test.log') != ''
        run: python3 tools/ci_annotate.py test.log build
      - name: The MCP server, over stdio
        run: pixi run --locked -e mcp python3 tools/tests/mcp_smoke.py

  # The car's computers are 64-bit ARM (the Orin, the Pis): the same tests on GitHub's free
  # ARM runner, then the HUD and the map window (aav_hud_raylib, PLAN T9.2) checked as ARM
  # programs, and each drawn once on a virtual screen. pixi.lock has linux-aarch64 already.
  # Every push, like linux: it takes about as long (12 min on 24 Oct), and runs beside it.
  arm:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/rattler/cache/pkgs
          # Not pixi-pkgs-Linux-*: the linux job's packages are x86_64.
          key: pixi-pkgs-arm64-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          restore-keys: pixi-pkgs-arm64-${{ runner.os }}-
      - name: pixi run test
        timeout-minutes: 45
        env:
          PYTEST_ADDOPTS: -o faulthandler_timeout=300
        run: pixi run --locked test 2>&1 | tee test.log
      - name: Failures as annotations (readable without signing in)
        if: (failure() || cancelled()) && hashFiles('test.log') != ''
        run: python3 tools/ci_annotate.py test.log build
      # The HUD's CMake skips it, with only a warning, where X11's headers are missing: so
      # check that both programs were built, and for ARM.
      - name: The HUD and the map window, built for ARM
        run: |
          for prog in hud map; do
            f=install/aav_hud_raylib/lib/aav_hud_raylib/$prog
            if [[ ! -x $f ]]; then
              echo "::error title=aav_hud_raylib::no $f: the HUD wasn't built (see its CMake warning)"
              exit 1
            fi
            kind=$(file -bL "$f")
            echo "$prog: $kind"
            if [[ $kind != *aarch64* ]]; then
              echo "::error title=aav_hud_raylib::$prog isn't an ARM program: $kind"
              exit 1
            fi
          done
      # Xvfb is a screen in memory; Mesa draws in software (no GPU here). --demo: pretend
      # data, no ROS. Each program saves a picture after 4 s and quits. ros2 run, as on the
      # car: ROS's setup puts the environment's libraries on the loader's path.
      - name: The HUD and the map window, drawn once
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          mkdir -p screens
          for prog in hud map; do
            if ! xvfb-run -a -s '-screen 0 1920x1080x24' pixi run --locked tools/ros.sh --local \
                 ros2 run aav_hud_raylib "$prog" --demo --screenshot "$PWD/screens/$prog.png" \
                 > "screens/$prog.log" 2>&1 || [[ ! -s screens/$prog.png ]]; then
              echo "::error title=aav_hud_raylib $prog drew no picture on ARM::$(tail -25 "screens/$prog.log" | python3 -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))')"
              exit 1
            fi
            # A notice, so the picture's size shows without signing in (all black: a few KB).
            echo "::notice title=aav_hud_raylib $prog on ARM::$(file -b "screens/$prog.png"), $(wc -c < "screens/$prog.png") bytes"
          done
      - name: Keep the pictures
        if: always() && hashFiles('screens/*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: arm-screens
          path: screens/
          retention-days: 14

  # The car kit (docs/car-install.md) as the car uses it: made by pixi run car-kit, then
  # car_install.sh --all on 64-bit ARM Linux with no network at all (a network namespace
  # of its own), so a package or crate the kit forgot fails here, not in the car park.
  # Every push too: 6 min on 24 Oct (the kit 1 min, the offline install and build 4.5),
  # beside the tests, so a crate or package the kit can't carry fails the push that added it.
  # Twice: on Ubuntu 24.04, and on 22.04, the car's own OS (JetPack 6 on the Orin). The
  # 24.04 job keeps the check name `car-kit` (main's required check). The 22.04 one is new
  # (26 Oct) and allowed to fail until it has passed a few times: then drop continue-on-error.
  car-kit:
    name: ${{ matrix.name }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: car-kit
            os: ubuntu-24.04-arm
          - name: car-kit-22.04
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.name == 'car-kit-22.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the kit holds a git bundle of the history
      - name: Install Pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/rattler/cache/pkgs
          key: pixi-pkgs-arm64-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          restore-keys: pixi-pkgs-arm64-${{ runner.os }}-
      - name: pixi run car-kit
        run: |
          # The bundle holds HEAD and main; a branch's checkout has no local main.
          git show-ref -q --verify refs/heads/main || git branch main HEAD
          df -h "$HOME" | tail -1
          pixi run --locked car-kit 2>&1 | tee car-kit.log
      # car_install.sh wants 13 GB free.
      - name: Make room
        run: |
          df -h "$HOME" | tail -1
          rm -rf .pixi vendor/car-kit-cache ~/.cache/rattler
          df -h "$HOME" | tail -1
      - name: car_install.sh --dry-run
        run: bash car-kit/car_install.sh --dry-run
      - name: car_install.sh --all, offline
        timeout-minutes: 30
        run: |
          # As the runner's own user (car_install.sh refuses root), in a network namespace
          # whose only network is its own loopback. sudo sets PSModulePath again (the
          # runner's /etc/environment): empty, or colcon picks PowerShell, see env above.
          sudo unshare --net -- sh -c "ip link set lo up && exec sudo -u $(id -un) -H env PATH='$PATH' PSModulePath= bash car-kit/car_install.sh --all" 2>&1 | tee car-install.log
          if grep -q "some packages didn't build" car-install.log; then
            grep -E '^(Failed|Aborted) +<<<|^Summary' "$HOME/aav-jazzy/build.log" || true
            exit 1
          fi
      - name: Failures as annotations (readable without signing in)
        if: failure() || cancelled()
        run: |
          log=car-install.log
          [[ -f $log ]] || log=car-kit.log
          python3 tools/ci_annotate.py "$log" "$HOME/aav-jazzy/aav/build"
      - name: The installed stack runs
        run: |
          ~/aav-jazzy/aav.sh ros2 pkg list > pkgs.txt
          echo "$(grep -c '^aav' pkgs.txt) of our packages installed"
          for pkg in aav_bringup aav_hud_raylib aav_spine_bridge; do
            if ! grep -qx "$pkg" pkgs.txt; then
              echo "::error title=car kit::$pkg isn't installed"
              exit 1
            fi
          done
          file -bL ~/aav-jazzy/aav/install/aav_hud_raylib/lib/aav_hud_raylib/hud

  # Gazebo, headless: the car's whole graph, a drive, and a stop for a box (PLAN T2.6).
  # New 22 Oct and not yet seen to pass on GitHub's computers (no GPU: the cameras render
  # in software, tools/software_gl.sh), so a failure here doesn't turn the night red yet. Remove
  # continue-on-error once it has passed a few nights.
  sim:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install Pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/rattler/cache/pkgs
          key: pixi-pkgs-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          restore-keys: pixi-pkgs-${{ runner.os }}-
      - name: pixi run build
        run: pixi run --locked build
      # No GPU here, and our environment's EGL has no driver of its own: without
      # tools/software_gl.sh (Mesa's llvmpipe) Gazebo crashed as the world loaded, and
      # sim-check found nothing in 120 s (23 Oct, reproduced on oirp-spss).
      - name: pixi run sim-check --obstacle
        env:
          QT_QPA_PLATFORM: offscreen
          AAV_SIM_LOG: ${{ github.workspace }}/sim-logs/aav-sim-check.log
          ROS_LOG_DIR: ${{ github.workspace }}/sim-logs/ros
        run: |
          mkdir -p sim-logs
          tools/software_gl.sh pixi run --locked sim-check --obstacle 2>&1 | tee sim-logs/sim.log
      # Readable without signing in: sim-check's FAIL lines and the launch log's last errors.
      - name: Failures as annotations (readable without signing in)
        if: failure() && hashFiles('sim-logs/sim.log') != ''
        run: python3 tools/ci_annotate.py --sim sim-logs/sim.log sim-logs/aav-sim-check.log
      # Everything: sim-check's output, the launch log, each node's ROS log. Anyone can list
      # a public repo's artifacts (api.github.com/repos/AAV-2025-2026/ecolo-av/actions/artifacts),
      # but downloading one needs a GitHub sign-in (or a token).
      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sim-logs
          path: sim-logs/
          retention-days: 14
          if-no-files-found: ignore
