# pixi run test on GitHub's computers, so "it works on my machine" can't creep in.
#   Linux (Ubuntu 24.04, like the car): every push and every pull request.
#   Mac (Apple Silicon): every night, and on demand from the Actions tab. Mac minutes use
#   up a private repo's free allowance much faster than Linux ones, so not on every push.
# The Pixi version matches the one that wrote pixi.lock; raise both together.
# A failed test step prints each failing test as an annotation (tools/ci_annotate.py):
# GitHub's API shows those to anyone, the job's log only to people signed in.
name: test

on:
  # main only: a push of a helper's half-done branch (wt/*, archive/*) mailed a failure
  # each time. A pull request still tests its branch.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * *"   # 03:00 in Ottawa (EDT)
  workflow_dispatch:

# shell: bash means bash -eo pipefail, so a failed test fails through tee too.
defaults:
  run:
    shell: bash

env:
  PIXI_VERSION: v0.81.0
  # GitHub's Ubuntu runners ship PowerShell and set PSModulePath, so colcon takes PowerShell
  # for its shell and sets each package's environment from package.ps1: our own packages'
  # paths then never reach a build (aav_hud_raylib's cargo found no aav_interfaces). Empty,
  # colcon uses sh, as on a laptop.
  PSModulePath: ""

jobs:
  linux:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install Pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/rattler/cache/pkgs
          key: pixi-pkgs-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          restore-keys: pixi-pkgs-${{ runner.os }}-
      - name: pixi run test
        run: pixi run --locked test 2>&1 | tee test.log
      - name: Failures as annotations (readable without signing in)
        # Not when the run failed before the tests (GitHub down, say): no test.log.
        if: failure() && hashFiles('test.log') != ''
        run: python3 tools/ci_annotate.py test.log build
      - name: The MCP server, over stdio
        run: pixi run --locked -e mcp python3 tools/tests/mcp_smoke.py

  mac:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install Pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v5
        with:
          path: ~/Library/Caches/rattler/cache/pkgs
          key: pixi-pkgs-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          restore-keys: pixi-pkgs-${{ runner.os }}-
      - name: pixi run test
        run: pixi run --locked test 2>&1 | tee test.log
      - name: Failures as annotations (readable without signing in)
        # Not when the run failed before the tests (GitHub down, say): no test.log.
        if: failure() && hashFiles('test.log') != ''
        run: python3 tools/ci_annotate.py test.log build
      - name: The MCP server, over stdio
        run: pixi run --locked -e mcp python3 tools/tests/mcp_smoke.py

  # Gazebo, headless: the car's whole graph, a drive, and a stop for a box (PLAN T2.6).
  # New 22 Oct and not yet seen to pass on GitHub's computers (no GPU: the cameras render
  # in software), so a failure here doesn't turn the night red yet. Remove
  # continue-on-error once it has passed a few nights.
  sim:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install Pixi
        run: |
          curl -fsSL https://pixi.sh/install.sh | bash
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/rattler/cache/pkgs
          key: pixi-pkgs-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          restore-keys: pixi-pkgs-${{ runner.os }}-
      - name: pixi run build
        run: pixi run --locked build
      - name: pixi run sim-check --obstacle
        env:
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: pixi run --locked sim-check --obstacle
