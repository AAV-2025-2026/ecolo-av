name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          locked: true   # fail if pixi.lock does not match pixi.toml
          cache: true

      - run: pixi run test
